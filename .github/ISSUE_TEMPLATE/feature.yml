name: Feature
description: A new feature or a change to a feature.
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: The problem that you have now.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Change
      description: The change that you want.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Other ways
      description: Other ways to solve the problem, if you know of them.
