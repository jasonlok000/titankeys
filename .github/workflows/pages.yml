# Publishes the website (site/: the home page, the privacy policy and the news feed the app reads) from main, so there's no
# separate gh-pages branch to keep in step (owner, 2026-11-14: one branch).
name: Website

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, as GitHub's own Pages starter does: the deploy job starts after the upload is stored. In one job, deploy-pages
  # sometimes found no artifact yet (2026-11-24, three failed runs in a row).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
