name: Prepare Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version, for example 0.2.0'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Bump the app version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bun .github/ink-release.mjs prepare
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: release/v${{ inputs.version }}
          title: 'release: v${{ inputs.version }}'
          commit-message: 'release: v${{ inputs.version }}'
          body: |
            Release v${{ inputs.version }}. Merging this PR builds and publishes the signed APK.

            Before merging, rewrite the draft in `release-notes.txt` and delete its draft line. Write a few short lines under App: the app shows them after the update. Do not write a "Bug fixes" line: the release adds one to the end of App with the number of lines under Fixed. The New and Fixed sections become the full GitHub release notes. Write `skip` under the version heading to release without notes.
          add-paths: |
            ink.toml
            package.json
            README.md
            release-notes.txt
