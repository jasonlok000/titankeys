# TitanKeys: Cantonese, Yale. The spelling rules are the owner's Yale schema,
# yale.schema.yaml from rime/rime-jyutping (LGPL-3.0, by 幸延), applied to
# rime-cantonese's Jyutping word list (CC BY 4.0), which Jyutping shares.
# As in the owner's schema, tones aren't typed.
schema:
  schema_id: tk_yale_strict
  name: 耶魯
  description: Cantonese, Yale (rime-jyutping's Yale rules on rime-cantonese)
  version: "2026.11.16"
__include: tk_variants:/
engine:
  processors: [ ascii_composer, recognizer, predictor, key_binder, speller, punctuator, selector, navigator, express_editor ]
  segmentors: [ ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor ]
  translators: [ predict_translator, punct_translator, script_translator ]
  filters: [ simplifier@zh_hans, simplifier@zh_hk, simplifier@zh_tw, uniquifier ]
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # Standard Yale's low tones (4, 5, 6) write an h after the vowels: sihk 食, faahn 飯, neih 你, and m̀h 唔 on a syllabic
    # nasal. Typed or not, as the user likes (native review, 2026-11-17): the h spelling is added, the plain one stays.
    - derive/^([a-z]*?[aeiou]+)(ng|m|n|p|t|k)?([456])$/$1h$2$3/
    - derive/^(m|ng)([456])$/$1h$2/
    - xform/\d$//
    - xform/^jy/y/
    - xform/^j/y/
    - xform/^z/j/
    - xform/^c/ch/
    - xform/aa$/a/
    - xform/aah$/ah/
    - xform/eu/iu/
    - xform/eo/eu/
    - xform/oe/eu/
    - xform/em/im/
    - xform/ep/ip/
    # Interchangeable initials (owner, 2026-11-17: "For yale specifically, make j and z, n and l interchangeable"): z types
    # Yale's j, as Jyutping writes it; n and l type each other, as many speakers merge them. Initials only, and ng stays ng.
    # Lazy sounds, as many speakers say them (native review, 2026-11-17): ng and no initial for each other (o for 我, aam for
    # 啱, ngoi for 愛), and gw as g (gok for 國). Not kw as k: it put 規 over 啟 for kai (Master, 2026-11-17).
    # Jyutping's spellings typed in Yale: c for ch (cing 情) and oe for eu (hoeng 香), so they find real syllables, not
    # letters taken one by one as abbreviations (native review: ci, cing, hoeng gave 出嚙我, 可誒五).
    - derive/^ch/c/
    - derive/eu/oe/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^(ng).+$/$1/
    - abbrev/^(ch).+$/$1/
    - abbrev/^([gk]w).+$/$1/
translator:
  dictionary: jyut6ping3
  prism: tk_yale_strict
zh_hans: { option_name: zh_hans, opencc_config: tk_t2s_yue.json, tips: none }
zh_hk:   { option_name: zh_hk,   opencc_config: t2hkf.json, tips: none }
zh_tw:   { option_name: zh_tw,   opencc_config: t2tw.json, tips: none }
# Cantonese's grammar model (librime-octagram, #56): data.sh's tk_yue.gram, which words follow which in Cantonese text,
# so Space puts the likelier phrase first. A pair of single characters counts too (collocation_min_length 2: octagram's
# default of 3 leaves out 咗 + 雨), as measured in docs/studies/56-cantonese-dictionary.md.
grammar: { language: tk_yue, collocation_min_length: 2 }
# The next-word suggestions after a commit (librime-predict, #56): native/rime/predict.py's table for this language, as
# many as it has (at most 8), and they go on after a suggestion is picked.
predictor: { db: predict-yue.db, max_candidates: 0, max_iterations: 0 }

punctuator: { import_preset: symbols_cantonese }
key_binder: { import_preset: default }
recognizer: { import_preset: default }
