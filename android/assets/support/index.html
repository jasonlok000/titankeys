<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>Support TitanKeys</title>
<!--
  TitanKeys' support screens, round 2 (support-app.html). Ships as an offline asset in a full-screen WebView: local fonts only,
  no network, and all data through G's bridge (window.TitanKeysSupport.post / window.titankeysSupport.receive). Without the
  bridge it runs on the SAMPLE data below, so it previews on its own: support-app.html?state=... for each render.
  The Titan's square screen: 1076 x 1200 px, about 690 x 770 CSS px. Words: F's docs/support-text.md (47a38854).
  Round 2 follows the independent review of round 1 (X:\Atlas\.dev\support-review-r1.md): bugs, a smaller pay dock with the rank
  as its hero, a thank-you that peaks, a content-sized podium, a supporters' board that rewards, anchored empty screens, a 15px
  text floor, and tier and custom polish.
-->
<style>
  @font-face { font-family: Inter; src: url(inter_regular.otf); font-weight: 400; }
  @font-face { font-family: Inter; src: url(inter_bold.otf); font-weight: 700; }
  :root {
    /* Colour: pure black, one orange, greys no darker than #8A8480 for text. */
    --bg: #000; --s1: #0F0B09; --s2: #1A1310; --s3: #1E1410; --line: #2E2925; --line-strong: #5A534E;
    --ink: #FFF1E6; --body: #D9D2CC; --muted: #A39B94; --dim: #8A8480;
    --accent: #F07C4A; --accent-soft: #F07C4A24; --on-accent: #1A0F0A; --deep: #2A120A;
    /* Type: nothing under 15px. 15 · 16 · 18 · 22 · 26 · 32 · 40 · 56 · 72. */
    --t-xs: 15px; --t-s: 16px; --t-m: 18px; --t-l: 22px; --t-xl: 26px; --t-2xl: 32px; --t-3xl: 40px; --t-4xl: 56px; --t-5xl: 72px;
    /* Spacing: 4-based. Side margin 33px = 52px on the phone. */
    --g1: 4px; --g2: 8px; --g3: 12px; --g4: 16px; --g5: 24px; --g6: 32px; --g7: 48px;
    --side: 33px; --r-s: 12px; --r-m: 18px; --r-l: 24px;
    --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.3, 1.35, .5, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 400 var(--t-m)/1.45 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-wrap: pretty; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .app { position: relative; width: 100%; height: 100%; max-width: 690px; margin: 0 auto; overflow: hidden; background: #000; }
  .view { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; display: none; }
  .view::-webkit-scrollbar { display: none; }
  .view.on { display: block; animation: enter .32s var(--ease); }
  .view.fill.on { display: flex; flex-direction: column; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } }
  .pad { padding: 0 var(--side); }

  /* Every top bar is solid black, with a 24px fade under it, so nothing ghosts through. */
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: var(--g3); height: 64px; padding: 0 var(--side); background: #000; flex: none; }
  .bar::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 24px; background: linear-gradient(#000, #0000); pointer-events: none;
    opacity: 0; transition: opacity .2s; }
  .bar.scrolled::after { opacity: 1; }
  .bar .back { width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
  .bar .back svg { width: 24px; height: 24px; }
  .bar .title { font-weight: 700; font-size: var(--t-m); opacity: 0; transition: opacity .2s; }
  .bar.scrolled .title { opacity: 1; }
  h1 { margin: 0; font-size: var(--t-3xl); line-height: 1.1; letter-spacing: -.02em; font-weight: 700; }
  .kicker { color: var(--accent); font-size: var(--t-xs); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .lede { color: var(--muted); font-size: var(--t-m); margin: var(--g2) 0 0; }
  .muted { color: var(--muted); }
  .clip1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clip2, .clip3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .clip2 { -webkit-line-clamp: 2; } .clip3 { -webkit-line-clamp: 3; }

  /* Buttons. */
  .primary { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 60px; padding: 8px 16px;
    border-radius: 32px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: var(--t-l); line-height: 1.2;
    transition: transform .15s var(--ease); }
  .primary:active { transform: scale(.98); }
  .primary .sub { font-size: var(--t-xs); font-weight: 400; opacity: .85; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .primary .sub b { font-weight: 700; display: inline-block; }
  .primary .sub b.bump { animation: bump .45s var(--spring); }
  @keyframes bump { 0% { transform: translateY(8px); opacity: 0; } }
  .quiet { display: block; width: 100%; height: 52px; color: var(--muted); font-weight: 700; font-size: var(--t-m); }
  .link { color: var(--muted); font-size: var(--t-xs); font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }

  /* The cup, drawn like the guide: cream outline, orange coffee that rises from the bottom. */
  .cup { display: block; overflow: visible; }
  .cup .stroke { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  .cup .dash { stroke-dasharray: 2.2 2; }
  .cup .plus { stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; }
  .cup .fill { fill: var(--accent); transform-box: fill-box; transform-origin: 50% 100%; transition: transform .3s var(--ease); }
  .steam path { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; stroke-dasharray: 14; animation: steam 2.8s ease-in-out infinite; }
  .steam path + path { animation-delay: 1.1s; }
  @keyframes steam { 0% { stroke-dashoffset: 14; opacity: 0; } 35% { opacity: .9; } 100% { stroke-dashoffset: -14; opacity: 0; } }

  /* ---------- Settings: the card at the very bottom. ---------- */
  .srow { display: flex; justify-content: space-between; align-items: center; height: 64px; border-bottom: 1px solid var(--line); font-size: var(--t-l); }
  .srow span { color: var(--muted); font-size: var(--t-m); }
  .ssec { margin: var(--g6) 0 var(--g2); }
  .coffeecard { position: relative; display: flex; align-items: center; gap: var(--g4); width: 100%; margin: var(--g6) 0 var(--g7); padding: var(--g5);
    border-radius: var(--r-l); background: radial-gradient(120% 140% at 0% 0%, #2A150B, var(--s1) 60%); text-align: left; isolation: isolate; }
  .coffeecard::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; z-index: -1;
    background: conic-gradient(from var(--spin), var(--line) 0 62%, var(--accent) 80%, var(--line) 98%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 7s linear infinite; }
  @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --spin: 360deg; } }
  .coffeecard .t { font-weight: 700; font-size: var(--t-xl); }
  .coffeecard .s { color: var(--muted); font-size: var(--t-s); }
  .coffeecard .go { margin-left: auto; flex: none; color: var(--accent); }

  /* ---------- The popup: a true bottom sheet over the front page. ---------- */
  .front { padding: 26px var(--side); filter: brightness(.32) blur(2px); }
  .front .logo { font-weight: 700; font-size: var(--t-xl); } .front .logo b { color: var(--accent); }
  .front .prompt { font-weight: 700; font-size: var(--t-2xl); margin: 40px 0 var(--g2); text-transform: uppercase; }
  .front .box { height: 120px; border-radius: var(--r-m); background: var(--s2); border-left: 3px solid var(--accent); margin-top: var(--g5); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--g3) var(--side) var(--g4); border-radius: 28px 28px 0 0;
    background: var(--s2); border-top: 1px solid var(--line); box-shadow: 0 -24px 80px #000; animation: up .5s var(--ease); }
  @keyframes up { from { transform: translateY(100%); } }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 0 auto var(--g5); }
  .sheet .head { display: flex; justify-content: space-between; align-items: center; gap: var(--g4); }
  .sheet .line { font-size: var(--t-2xl); font-weight: 700; line-height: 1.12; letter-spacing: -.01em; }
  .herostat { margin-top: var(--g5); animation: rise .5s var(--ease) backwards; }
  .herostat b { display: block; font-size: var(--t-4xl); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .herostat span { color: var(--muted); font-size: var(--t-m); }
  .smallstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--g2); margin: var(--g5) 0 var(--g5); }
  .smallstat { padding: var(--g3) var(--g4); border-radius: var(--r-m); background: var(--s1); animation: rise .5s var(--ease) backwards; min-width: 0; }
  .smallstat:nth-child(2) { animation-delay: .08s; } .smallstat:nth-child(3) { animation-delay: .16s; }
  .smallstat b { display: block; font-size: var(--t-2xl); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .smallstat span { color: var(--muted); font-size: var(--t-xs); }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } }

  /* ---------- The support page. ---------- */
  .hero { padding: var(--g2) var(--side) 0; }
  .points { list-style: none; margin: var(--g4) 0 0; padding: 0; display: grid; gap: var(--g2); }
  .points li { display: flex; gap: var(--g3); align-items: baseline; color: var(--muted); text-wrap: balance; }
  .points li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); transform: translateY(-3px); }
  .points li:first-child { color: var(--ink); }
  .section { margin-top: var(--g7); }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 var(--side); margin-bottom: var(--g5); }
  .section-head a { color: var(--accent); font-size: var(--t-s); font-weight: 700; cursor: pointer; }

  /* Podium: content-sized, #1 raised, #2 and #3 lower; #1 settles in first, then the others. */
  .podium { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: var(--g2); align-items: start; padding: 0 var(--side); }
  .place { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0;
    padding: var(--g5) var(--g3) var(--g5); border-radius: var(--r-l); background: var(--s1); border: 1px solid var(--line);
    animation: settle .25s var(--ease) backwards; }
  .place.p1 { margin-top: 0; border: 2px solid var(--accent); background: radial-gradient(90% 60% at 50% 0%, #F07C4A26, var(--s1) 70%); }
  .place.p2 { margin-top: 40px; animation: rise .4s var(--ease) .33s backwards; }
  .place.p3 { margin-top: 60px; animation: rise .4s var(--ease) .41s backwards; }
  @keyframes settle { from { transform: scale(.96); opacity: 0; } }
  .medal { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: var(--t-s);
    border: 1.5px solid var(--line-strong); color: var(--ink); margin-bottom: var(--g3); font-variant-numeric: tabular-nums; }
  .p1 .medal { width: 46px; height: 46px; background: var(--accent); border: 0; color: var(--on-accent); font-size: var(--t-m);
    box-shadow: 0 0 0 6px var(--accent-soft); }
  .place .name { font-weight: 700; font-size: var(--t-m); line-height: 1.25; width: 100%; }
  .p1 .name { font-size: var(--t-l); }
  .place .msg { color: #B5ADA6; font-size: var(--t-s); line-height: 1.35; margin-top: var(--g2); width: 100%; }
  .place.you { box-shadow: 0 0 0 2px var(--accent); }

  .ranks { list-style: none; margin: var(--g4) 0 0; padding: 0 var(--side); }
  .rank { position: relative; display: grid; grid-template-columns: 44px 1fr 32px; gap: var(--g3); align-items: start; padding: var(--g4) 0;
    border-bottom: 1px solid var(--line); animation: rise .45s var(--ease) backwards; }
  .rank .n { color: var(--dim); font-weight: 700; font-size: var(--t-m); font-variant-numeric: tabular-nums; line-height: 1.35; }
  .rank .who { min-width: 0; }
  .rank .who b { display: flex; align-items: center; font-size: var(--t-m); line-height: 1.35; min-width: 0; }
  .rank .who b .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .who span.m { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
    color: var(--muted); font-size: var(--t-s); margin-top: 2px; }
  .rank .more { width: 36px; height: 36px; margin: -6px -6px 0 0; border-radius: 50%; color: var(--dim); display: grid; place-items: center; }
  .rank.you { background: var(--s3); border: 1px solid var(--accent); border-radius: var(--r-s); padding-left: var(--g3); padding-right: var(--g3);
    margin-bottom: 1px; }
  .rank.you .n { color: var(--accent); }
  .tag { flex: none; display: inline-flex; align-items: center; height: 22px; padding: 0 8px; margin-left: var(--g2); border-radius: 6px;
    background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; letter-spacing: .06em; line-height: 1; }
  .reportbox { grid-column: 2 / 4; display: flex; gap: var(--g2); align-items: center; margin-top: var(--g2); }
  .reportbox button { height: 38px; padding: 0 var(--g5); border-radius: 19px; border: 1.5px solid var(--line-strong); color: var(--ink);
    font-size: var(--t-xs); font-weight: 700; }
  .toast { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); padding: var(--g3) var(--g5); border-radius: 24px;
    background: var(--ink); color: var(--on-accent); font-weight: 700; font-size: var(--t-xs); white-space: nowrap; z-index: 9; animation: rise .4s var(--spring); }

  /* Amounts. */
  .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; height: 52px; margin: 0 var(--side); padding: 4px; border-radius: 26px;
    background: var(--s1); border: 1px solid var(--line); }
  .seg .knob { position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px); border-radius: 22px; background: var(--ink);
    transition: transform .35s var(--spring); }
  .seg.right .knob { transform: translateX(100%); }
  .seg button { position: relative; height: 100%; font-weight: 700; font-size: var(--t-m); color: var(--muted); transition: color .25s; }
  .seg button.on { color: var(--on-accent); }
  .tiers { display: grid; gap: var(--g2); margin: var(--g4) var(--side) 0; }
  .tier { display: grid; grid-template-columns: 40px 1fr auto; gap: var(--g4); align-items: center; padding: var(--g3) var(--g4);
    border-radius: var(--r-m); background: var(--s1); border: 1.5px solid var(--line); text-align: left;
    transition: border-color .2s, background .3s, transform .15s var(--ease); }
  .tier:active { transform: scale(.985); }
  .tier.on { border-color: var(--accent); background: linear-gradient(90deg, #22120A, var(--s1)); }
  .tier .nm { font-weight: 700; font-size: var(--t-m); }
  .tier .ln { color: var(--muted); font-size: var(--t-xs); }
  .tier .when { color: var(--accent); font-size: var(--t-xs); margin-top: 2px; }
  .tier .pr { font-weight: 700; font-size: var(--t-m); color: var(--muted); font-variant-numeric: tabular-nums; transition: color .2s; }
  .tier.on .pr { color: var(--accent); }
  .tier .chev { color: var(--muted); }
  .privacy { color: var(--dim); font-size: var(--t-xs); padding: var(--g4) var(--side) 0; }

  /* The pay dock: one button, with the rank it buys underneath its price. About 96px. */
  .dock { position: sticky; bottom: 0; z-index: 4; padding: var(--g4) var(--side) var(--g4); background: #000; margin-top: var(--g6); }
  .dock::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 32px; background: linear-gradient(#0000, #000); pointer-events: none; }
  .dock .primary { min-height: 68px; }
  .dock .err { text-align: center; color: var(--muted); font-size: var(--t-xs); margin-top: var(--g2); }

  /* Custom: the cups, the amount and the slider as one centred group. */
  #custom .middle { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 var(--side); }
  .cups { display: flex; justify-content: center; align-items: flex-end; gap: var(--g3); height: 150px; }
  .cups .times { font-size: var(--t-3xl); font-weight: 700; color: var(--accent); margin-left: var(--g2); align-self: center; font-variant-numeric: tabular-nums; }
  .readout { text-align: center; margin-top: var(--g5); }
  .readout .d { font-size: var(--t-4xl); font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .readout .c { color: var(--accent); font-size: var(--t-l); margin-top: var(--g2); }
  .readout .pot { color: var(--body); font-size: var(--t-m); margin-top: var(--g2); min-height: 26px; }
  .slider { margin-top: var(--g6); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 4px; margin: 0;
    background: linear-gradient(90deg, var(--accent) var(--p), var(--line) var(--p)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; background: var(--ink);
    border: 7px solid var(--accent); box-shadow: 0 0 0 8px var(--accent-soft); }
  .ticks { position: relative; height: 22px; margin-top: var(--g3); color: var(--muted); font-size: var(--t-xs); font-variant-numeric: tabular-nums; }
  .ticks span { position: absolute; transform: translateX(-50%); }
  .ticks span:first-child { transform: none; } .ticks span:last-child { transform: translateX(-100%); }

  /* Test checkout (Debug): a sheet like Play's over a plain black scrim. */
  .scrim { position: absolute; inset: 0; background: #000000E6; z-index: 8; animation: enter .25s; }
  .checkout { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--g3) var(--side) var(--g6); border-radius: 28px 28px 0 0;
    background: var(--s2); border-top: 1px solid var(--line); animation: up .4s var(--ease); }
  .checkout .row { display: flex; justify-content: space-between; align-items: baseline; padding: var(--g4) 0; border-bottom: 1px solid var(--line); margin-top: var(--g3); }
  .checkout .row b { font-size: var(--t-xl); }
  .checkout p { color: var(--muted); font-size: var(--t-xs); margin: var(--g4) 0 var(--g5); }

  /* ---------- The thank-you: a warm rise, then the words, centred near 42%. ---------- */
  #thanks { background: #000; overflow: hidden; }
  .flood { position: absolute; left: -4px; right: -4px; bottom: 0; height: 0; will-change: height; }
  .flood .body { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(0deg, #E8693A 0%, #F07C4A 30%, #F7A570 70%, #FFD3A8 100%); }
  .flood svg { position: absolute; left: 0; top: -30px; width: 200%; height: 32px; animation: wave 3s linear infinite; }
  @keyframes wave { to { transform: translateX(-50%); } }
  .bubble { position: absolute; bottom: -16px; border-radius: 50%; background: #FFF4E8; animation: bubble linear infinite; }
  @keyframes bubble { from { transform: translateY(0); } to { transform: translateY(-900px); } }
  .thanks-words { position: absolute; left: var(--side); right: var(--side); top: 42%; transform: translateY(-50%); text-align: center; z-index: 2;
    display: flex; flex-direction: column; align-items: center; }
  .thanks-words .bigcup { margin-bottom: var(--g4); }
  .thanks-words h1 { font-size: var(--t-5xl); letter-spacing: -.03em; opacity: 0; transform: translateY(16px); transition: opacity .6s, transform .6s var(--ease); }
  .thanks-words .amount { font-size: var(--t-l); font-weight: 700; margin-top: var(--g3); font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .5s .1s; }
  .thanks-words p { font-size: var(--t-m); line-height: 1.4; margin: var(--g4) auto 0; max-width: 30ch; text-wrap: balance; opacity: 0;
    transform: translateY(10px); transition: opacity .6s .6s, transform .6s .6s var(--ease); }
  .settled .thanks-words h1, .settled .thanks-words .amount { opacity: 1; transform: none; }
  .settled .thanks-words p { opacity: .7; transform: none; }
  .dark-words .thanks-words { color: var(--on-accent); }
  #thanks:not(.dark-words) .thanks-words { top: 30%; }
  .dark-words .thanks-words .cup .stroke { stroke: var(--on-accent); }
  .dark-words .thanks-words .cup .fill { fill: #FFF1E6; }
  .thanks-actions { position: absolute; left: var(--side); right: var(--side); bottom: var(--g6); z-index: 2; display: grid; gap: var(--g2);
    opacity: 0; transform: translateY(12px); transition: opacity .5s .9s, transform .5s .9s var(--ease); }
  .settled .thanks-actions { opacity: 1; transform: none; }
  .thanks-actions .invite { text-align: center; font-weight: 700; font-size: var(--t-m); color: var(--on-accent); margin-bottom: var(--g4); text-wrap: balance; }
  .thanks-actions .primary { background: var(--on-accent); color: var(--ink); }
  .thanks-actions .quiet { color: var(--deep); }

  /* ---------- Opt-in: fields up top, the buttons anchored at the bottom. ---------- */
  #optin .content { flex: 1; padding: 0 var(--side); }
  #optin .actions { padding: var(--g4) var(--side) var(--g6); display: grid; gap: var(--g1); }
  .field { margin-top: var(--g4); padding: var(--g3) var(--g4); border-radius: var(--r-m); background: var(--s1); border: 1.5px solid var(--line); }
  .field.focus { border-color: var(--accent); }
  .field label { display: flex; justify-content: space-between; color: var(--muted); font-size: var(--t-xs); font-weight: 700; }
  .field label .count { font-variant-numeric: tabular-nums; font-weight: 400; }
  .field label .count.full { color: var(--accent); font-weight: 700; }
  .field input, .field textarea { width: 100%; margin-top: var(--g1); background: none; border: 0; outline: 0; color: var(--ink);
    font: inherit; font-size: var(--t-l); resize: none; }
  .field textarea { min-height: 3em; line-height: 1.35; }
  .limit { display: flex; align-items: center; gap: var(--g3); margin-top: var(--g5); padding: var(--g3) var(--g4); border-radius: var(--r-m);
    background: var(--accent-soft); font-size: var(--t-s); }
  .badge { flex: none; display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 8px; background: var(--accent);
    color: var(--on-accent); font-weight: 700; font-size: var(--t-xs); }
  .optpreview { margin-top: var(--g5); }
  .optpreview .kicker { color: var(--muted); margin-bottom: var(--g2); }
  .optpreview .ranks { padding: 0; margin: 0; }
  .optpreview .rank { background: var(--s2); border: 1px solid var(--line); border-radius: var(--r-m); padding: var(--g4); }

  /* The supporter's own place, pinned under the title of their board. */
  .mine { position: sticky; top: 64px; z-index: 4; display: grid; grid-template-columns: auto 1fr; gap: var(--g4); align-items: center;
    min-height: 72px; margin: var(--g5) var(--side) 0; padding: var(--g3) var(--g5); border-radius: var(--r-m); background: var(--s3);
    border: 1px solid var(--accent); overflow: hidden; }
  .mine .r { font-size: var(--t-2xl); font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .mine .who { min-width: 0; } .mine .who b { display: flex; align-items: center; font-size: var(--t-m); }
  .mine .who b .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mine .who .m { display: block; color: var(--muted); font-size: var(--t-s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mine::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, #FFF1E61F 50%, transparent 70%);
    transform: translateX(-100%); animation: shimmer 1.2s .5s var(--ease) 1 forwards; pointer-events: none; }
  @keyframes shimmer { to { transform: translateX(100%); } }
  .lede.orange { color: var(--accent); }

  /* Empty and offline: a dashed card at about a third of the height, with a cup. */
  .emptywrap { display: flex; flex-direction: column; justify-content: center; min-height: 340px; padding: 0 var(--side); }
  .empty { padding: var(--g6) var(--g5); border-radius: var(--r-l); border: 1.5px dashed var(--line-strong); text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: var(--g4); }
  .empty .spot { position: relative; }
  .empty .spot .one { position: absolute; right: -14px; top: -6px; height: 26px; padding: 0 8px; border-radius: 13px; background: var(--accent);
    color: var(--on-accent); font-weight: 700; font-size: var(--t-xs); display: grid; place-items: center; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.08); } }
  .empty p { margin: 0; font-size: var(--t-l); font-weight: 700; text-wrap: balance; }
  .empty .retry { height: 44px; padding: 0 var(--g5); border-radius: 22px; border: 1.5px solid var(--line-strong); font-weight: 700; font-size: var(--t-s); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  .reduce *, .reduce *::before, .reduce *::after { animation: none !important; transition: none !important; }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Settings, with the coffee card at the very bottom. -->
  <section class="view" id="settings">
    <div class="bar"><button class="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="title">Settings</span></div>
    <div class="pad">
      <h1>Settings</h1>
      <div class="ssec kicker">Help</div>
      <div class="srow">Setup <span>›</span></div>
      <div class="srow">Guide <span>›</span></div>
      <div class="srow">Send feedback <span>›</span></div>
      <div class="srow">About <span>3.0</span></div>
      <div class="ssec kicker">Start over</div>
      <div class="srow">Reset most things <span>›</span></div>
      <div class="srow">Reset literally everything <span>›</span></div>
      <button class="coffeecard" data-go="support">
        <span data-cup="steam" data-size="56"></span>
        <span><div class="t" data-t="cardTitle"></div><div class="s" data-t="cardLine"></div></span>
        <svg class="go" width="24" height="24" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>

  <!-- The popup: once, after about ten typing days, a sheet over the front page. -->
  <section class="view" id="popup">
    <div class="front" aria-hidden="true">
      <div class="logo">Titan<b>Keys</b></div>
      <div class="prompt">Practice. You need it.</div>
      <div class="muted">Type or swipe whatever you like.</div>
      <div class="box"></div>
    </div>
    <div class="sheet" role="dialog" aria-labelledby="popupline">
      <div class="grab"></div>
      <div class="head"><div class="line" id="popupline" data-t="popupLine"></div><span data-cup="steam" data-size="48"></span></div>
      <div id="stats"></div>
      <button class="primary" data-go="support" data-t="popupButton"></button>
      <button class="quiet" data-act="nah" data-t="nah"></button>
    </div>
  </section>

  <!-- The support page. -->
  <section class="view" id="support">
    <div class="bar"><button class="back" data-go="settings" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="title" data-t="heading"></span></div>
    <div class="hero">
      <h1 data-t="heading"></h1>
      <ul class="points" id="points"></ul>
    </div>
    <div class="section">
      <div class="section-head"><span class="kicker" data-t="fund"></span><a data-go="board" id="seeall"></a></div>
      <div id="boardpreview"></div>
      <div class="privacy" data-t="privacy"></div>
    </div>
    <div class="section">
      <div class="seg" id="cadence"><span class="knob"></span><button data-cad="m" data-t="monthly"></button><button data-cad="o" data-t="oneTime"></button></div>
      <div class="tiers" id="tiers"></div>
    </div>
    <div class="dock"><button class="primary" id="pay"></button><div class="err" id="payerr"></div></div>
  </section>

  <!-- Custom: one-time, any whole number of dollars. -->
  <section class="view fill" id="custom">
    <div class="bar"><button class="back" data-go="support" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div class="pad"><h1 data-t="howMuch"></h1></div>
    <div class="middle">
      <div class="cups" id="custcups"></div>
      <div class="readout"><div class="d" id="custd"></div><div class="c" id="custc"></div><div class="pot" id="custpot"></div></div>
      <div class="slider"><input type="range" id="slider" min="1" max="50" value="5" aria-label="Dollars">
        <div class="ticks"><span style="left:0">$1</span><span style="left:18.4%">$10</span><span style="left:49%">$25</span><span style="left:100%">$50</span></div></div>
    </div>
    <div class="dock" style="margin-top:0"><button class="primary" id="pay2"></button></div>
  </section>

  <!-- The thank-you. -->
  <section class="view" id="thanks">
    <div class="flood" id="flood"><svg viewBox="0 0 1380 32" preserveAspectRatio="none"><path fill="#FFD3A8" d="M0 18 Q86 2 172 18 T345 18 T517 18 T690 18 T862 18 T1035 18 T1207 18 T1380 18 V32 H0 Z"/></svg><div class="body" id="bubbles"></div></div>
    <div class="thanks-words"><span class="bigcup" id="thankscup"></span><h1 data-t="thanksTitle"></h1><div class="amount" id="amount"></div><p data-t="thanksLine"></p></div>
    <div class="thanks-actions" id="thanksactions"></div>
  </section>

  <!-- The opt-in. -->
  <section class="view fill" id="optin">
    <div class="bar"><button class="back" data-act="later" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div class="content">
      <h1 data-t="join"></h1>
      <div class="limit" id="limit"></div>
      <div class="field focus"><label><span data-t="nameField"></span><span class="count" id="namecount"></span></label><input id="name" maxlength="40" autocomplete="off"></div>
      <div class="field" id="msgfield"><label><span data-t="messageField"></span><span class="count" id="msgcount"></span></label><textarea id="msg" rows="2"></textarea></div>
      <div class="optpreview" id="optpreview"></div>
    </div>
    <div class="actions"><button class="primary" data-act="add" data-t="addMe"></button><button class="quiet" data-act="anon" data-t="stayAnonymous"></button></div>
  </section>

  <!-- The board: everyone, or the supporter's own view. -->
  <section class="view" id="board">
    <div class="bar"><button class="back" data-go="support" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="title" id="boardbartitle"></span></div>
    <div class="pad"><h1 id="boardtitle"></h1><p class="lede" id="boardline"></p></div>
    <div id="mine"></div>
    <div style="margin-top:32px" id="boardfull"></div>
    <div class="privacy" data-t="privacy"></div>
    <div class="pad" style="padding-top:20px;padding-bottom:48px" id="removebox"></div>
  </section>

  <div id="overlay"></div>
</div>

<script>
"use strict";
// F's words (docs/support-text.md, 47a38854). PRE lines are coffee only; the juice is in SUPPORTER lines alone.
const T = {
  cardTitle: "Buy me a coffee", cardLine: "You made it to the bottom. Fancy a coffee?",
  popupLine: "Your thumbs have been busy.", tiles: ["Words", "Swipes", "Fixes", "Gestures"], popupButton: "Coffee fund", nah: "Nah",
  heading: "Support TitanKeys",
  points: ["Donating gets you nothing. Well, a spot on the board.", "It buys time: fixes, languages, new tricks.", "No ads. No paywall. Ever."],
  fund: "The coffee fund", fundLine: "The good people, by rank.",
  supporters: "The orange juice fund", supportersLine: "The good people. Cheers, all of you.",
  empty: "Empty. Any amount makes you #1.", anonymous: "Anonymous", report: "Report", reported: "Got it. We'll take a look.",
  oneTime: "One-time", monthly: "Monthly",
  tiers: [["A sip", "Small, but it counts."], ["A bigger sip", "Now we're brewing."], ["Half a coffee", "That's real caffeine."]],
  custom: ["Custom", "You pick."],
  monthlyNote: "Every month. Cancel any time in Play.", howMuch: "How much coffee?",
  wholePot: "That's a whole pot. I'll need a bigger table.",
  putsYou: (n, m) => m && m !== n ? `This puts you at <b>#${n}</b>, up from #${m}` : `This puts you at <b>#${n}</b>`,
  chipIn: "Chip in",
  thanksTitle: "Thank you!", thanksLine: "Fun fact: I don't actually drink coffee. I'm more of an orange juice person. But this means a lot.",
  join: "Join the board?", nameField: "Name (optional)", messageField: "Message (optional)",
  limits: { 3: "120 characters. Say something grand.", 10: "80 characters. Make it count.", 100: "40 characters. Short and sweet.", 0: "Name only for now. Climb for a message." },
  addMe: "Add me", stayAnonymous: "Stay anonymous",
  invite: tier => `You're in the top ${tier} now. Want a longer message?`, writeMore: "Write more", later: "Later",
  privacy: "Only names, messages and rank. Leave any time.", removeMe: "Remove me",
  billing: "Play can't take payments on this phone.", notReady: "Play's still waking up. Try again soon.",
  offline: "You're offline. The board will be back.",
  // Not F's yet (round 2 needs them): the board link, the offline retry, the amount line, the preview label.
  allRanks: n => `All ${n}`, retry: "Try again", previewLabel: "How you'll show",
  amount: (cups, rank) => `${cupsText(cups)}${rank ? ` · you're #${rank}` : ""}`,
};
const LIMITS = [[3, 120], [10, 80], [100, 40]];
const limitAt = rank => rank ? (LIMITS.find(([top]) => rank <= top) || [0, 0])[1] : 0;
const tierAt = rank => rank ? (LIMITS.find(([top]) => rank <= top) || [0])[0] : 0;
const FIFTHS = ["", "⅕", "⅖", "⅗", "⅘"];
/** Real fractions in fifths: "⅖ cup", "1 cup", "1 ⅖ cups". */
function cupsText(cups) {
  const fifths = Math.round(cups * 5), whole = Math.floor(fifths / 5), part = fifths % 5;
  const n = [whole || "", FIFTHS[part]].filter(Boolean).join(" ") || "⅕";
  return `${n} ${fifths === 5 || (!whole && part) ? "cup" : "cups"}`;
}

// Sample data, used when there's no bridge (preview and renders): long names and messages at each limit.
const L120 = "Finally a keyboard that gets the Titan. Swiping on real keys still feels like a magic trick to me, every single day!!!";
const L80 = "Obrigado from Lisbon. Portuguese accents on hold are perfect, keep it up please!";
const L40 = "Typing in Polish without Gboard. Finally";
const SAMPLE_ROWS = [
  ["Maximilian Alexander von Hohenzollern-Sigmaringen", L120, 6200], [null, L120, 4500], ["Priya Ramanathan-Krishnamurthy", L120, 3300],
  ["Tomás", L80, 2100], ["Sam K.", null, 1100], [null, "Keep going.", 800], ["Lukas", L80, 600], ["Ana", "the guide is so good", 500],
  ["R.", null, 400], ["Kenji Watanabe-Yamamoto", L80, 300], ["Olu", L40, 300], [null, null, 200], ["Marta", L40, 200], ["Dev", null, 100],
  ["Chris", L40, 100], ["Felix", "Hi from Berlin", 50],
];
const SAMPLE = {
  state: { products: [
    { id: "support_monthly_sip", price: "$0.99", baseCents: 99 }, { id: "support_monthly_small", price: "$1.39", baseCents: 139 },
    { id: "support_monthly_full", price: "$2.79", baseCents: 279 }, { id: "support_tip_sip", price: "$0.99", baseCents: 99 },
    { id: "support_tip_small", price: "$1.39", baseCents: 139 }, { id: "support_tip_full", price: "$2.79", baseCents: 279 },
    { id: "support_tip_unit", price: "$1.00", baseCents: 100 } ], totalCents: 0, billing: "ready", reduceMotion: false, preview: true },
  mine: 150, joined: false, stats: [12408, 3112, 214, 388], offline: false, empty: false,
};
function sampleBoard(addCents = 0) {
  if (SAMPLE.offline) return { available: false, entries: [] };
  if (SAMPLE.empty) return { available: true, entries: [], total: 0, myRank: null, joined: false };
  const rows = SAMPLE_ROWS.map(([name, message, cents], i) => ({ id: "s" + i, name, message, cents }));
  if (SAMPLE.joined) rows.push({ id: "you", name: "Mei Wong", message: L80, cents: SAMPLE.mine + addCents, you: true });
  rows.sort((a, b) => b.cents - a.cents);
  const entries = rows.map((r, i) => ({ ...r, rank: i + 1, message: r.message ? r.message.slice(0, limitAt(i + 1)) || null : null }));
  return { available: true, postingReady: true, joined: SAMPLE.joined, entries, total: entries.length,
    myRank: SAMPLE.joined ? entries.find(e => e.you).rank : null };
}
// Where the sample supporter lands; an empty board makes anyone #1.
const sampleRank = addCents => SAMPLE.empty ? 1 : SAMPLE_ROWS.filter(r => r[2] > SAMPLE.mine + addCents).length + 1;

// G's bridge (claude/support-webview): TitanKeysSupport.post(JSON {id, op, args}); answers and events come back through
// window.titankeysSupport.receive(text). Without it, the samples answer, so the page previews on its own.
const native = window.TitanKeysSupport;
let nextId = 1;
const waiting = new Map();
const events = { receipt: null, state: null };
window.titankeysSupport = {
  receive(text) {
    const msg = JSON.parse(text);
    if (msg.event) { events[msg.event]?.(msg.data); return; }
    const wait = waiting.get(msg.id); if (!wait) return;
    waiting.delete(msg.id);
    msg.ok ? wait.resolve(msg.result) : wait.reject(new Error(msg.error));
  },
};
const call = (op, args = {}) => new Promise((resolve, reject) => {
  const id = nextId++;
  waiting.set(id, { resolve, reject });
  native.post(JSON.stringify({ id, op, args }));
});
const STAT_KEYS = ["words", "swipes", "corrections", "gestures"];
const api = {
  state: () => native ? call("state") : Promise.resolve(SAMPLE.state),
  // Every page of the board, up to 100 places (each page is a read the server counts).
  board: async () => {
    if (!native) return sampleBoard();
    let data = await call("board", { page: 0 });
    for (let page = 1; page < 5 && data.available && data.nextOffset; page++) {
      const more = await call("board", { page });
      if (!more.available) break;
      data = { ...more, entries: [...data.entries, ...more.entries] };
    }
    return data;
  },
  preview: cents => native ? call("previewRank", { cents }).then(r => ({ ...r, myRank: r.myRank ?? board.myRank })) : Promise.resolve(SAMPLE.offline
    ? { available: false } : { available: true, rank: sampleRank(cents), myRank: SAMPLE.joined ? sampleRank(0) : null }),
  buy: (productId, quantity) => native ? call("purchase", quantity > 1 ? { productId, quantity } : { productId }) : Promise.resolve({ result: "preview" }),
  join: (anonymous, name, message) => native ? call("joinBoard", anonymous ? { anonymous } : { anonymous, name, message }) : Promise.resolve({ available: true }),
  report: publicId => native ? call("report", { publicId }) : Promise.resolve({ available: true, ok: true }),
  remove: () => native ? call("removeMe") : Promise.resolve({ available: true }),
  nah: () => native ? call("dismissPopup").then(() => call("close")) : Promise.resolve(history.back()),
  close: () => native ? call("close") : Promise.resolve(history.back()),
  stats: async () => native ? STAT_KEYS.map(k => (state.stats || {})[k] || 0) : SAMPLE.stats,
};

// ---------- Rendering. ----------
// Animation frames on a 16 ms timer: the same on screen, and they still run where frame callbacks are paused.
const frame = fn => setTimeout(() => fn(performance.now()), 16);
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ease = t => 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);
let reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let state = SAMPLE.state, board = { available: false, entries: [] };
let cadence = "m", tier = 0, dollars = 5, lastRank = null;

let cupId = 0;
/** The cup: [fill] 0..1, [size] its width; [steam] curls above; [dashed] is Custom's outline with a plus. */
function cup(fill, size, { steam = false, dashed = false } = {}) {
  const id = "c" + cupId++, f = Math.max(0, Math.min(1, fill));
  return `<svg class="cup" width="${size}" height="${size * 1.25}" viewBox="0 0 24 30" aria-hidden="true">
    ${steam ? `<g class="steam"><path d="M10 4 q-2 -2 0 -4"/><path d="M14 4 q-2 -2 0 -4"/></g>` : ""}
    <defs><clipPath id="${id}"><path d="M5 8 L19 8 L17.4 29 L6.6 29 Z"/></clipPath></defs>
    ${dashed ? "" : `<g clip-path="url(#${id})"><rect class="fill" x="0" y="8" width="24" height="21" data-f="${f}" style="transform:scaleY(${f})"/></g>`}
    <path class="stroke${dashed ? " dash" : ""}" d="M5 8 L19 8 L17.4 29 L6.6 29 Z"/><path class="stroke${dashed ? " dash" : ""}" d="M3.5 5.2 h17 v2.8 h-17 z M7 5.2 l1-2.2 h8 l1 2.2"/>
    ${dashed ? `<path class="stroke plus" d="M12 14 v9 M7.5 18.5 h9"/>` : ""}</svg>`;
}
function fillText() {
  document.querySelectorAll("[data-t]").forEach(el => { const v = T[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-cup]").forEach(el => { el.innerHTML = cup(.45, +el.dataset.size, { steam: el.dataset.cup === "steam" }); });
  $("#points").innerHTML = T.points.map(p => `<li>${esc(p)}</li>`).join("");
}

const nameHTML = e => `<span class="nm">${esc(e.name || T.anonymous)}</span>${e.you ? '<span class="tag">YOU</span>' : ""}`;
function podium(entries) {
  const order = [1, 0, 2].filter(i => entries[i]);
  return `<div class="podium">${order.map(i => {
    const e = entries[i];
    return `<div class="place p${i + 1}${e.you ? " you" : ""}"><div class="medal">${i + 1}</div>
      <div class="name clip2">${esc(e.name || T.anonymous)}</div>${e.message ? `<div class="msg ${i === 0 ? "clip3" : "clip2"}">${esc(e.message)}</div>` : ""}</div>`;
  }).join("")}</div>`;
}
function ranks(entries, from, to, reporting) {
  return `<ul class="ranks">${entries.slice(from, to).map((e, k) => `<li class="rank${e.you ? " you" : ""}" style="animation-delay:${Math.min(.04 * k, .4) + .35}s">
    <span class="n">${e.rank}</span><span class="who"><b>${nameHTML(e)}</b>${e.message ? `<span class="m">${esc(e.message)}</span>` : ""}</span>
    ${reporting && !e.you ? `<button class="more" data-report="${e.id}" aria-label="${T.report}"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg></button>` : "<span></span>"}</li>`).join("")}</ul>`;
}
function emptyBoard() {
  if (!board.available) return `<div class="emptywrap"><div class="empty">${cup(0, 64)}<p>${esc(T.offline)}</p><button class="retry" data-act="retry">${T.retry}</button></div></div>`;
  return `<div class="emptywrap"><div class="empty"><span class="spot">${cup(0, 64, { steam: true })}<span class="one">#1</span></span><p>${esc(T.empty)}</p></div></div>`;
}
function drawBoardPreview() {
  const e = board.entries || [];
  $("#seeall").textContent = e.length > 3 ? T.allRanks(board.total || e.length) + " ›" : "";
  $("#boardpreview").innerHTML = e.length ? podium(e) + ranks(e, 3, 5, false) : emptyBoard();
}
function drawBoardFull(supporter) {
  const e = board.entries || [];
  $("#boardtitle").textContent = $("#boardbartitle").textContent = supporter ? T.supporters : T.fund;
  $("#boardline").textContent = supporter ? T.supportersLine : T.fundLine;
  $("#boardline").classList.toggle("orange", supporter);
  const me = supporter && e.find(x => x.you);
  $("#mine").innerHTML = me ? `<div class="mine"><span class="r">#${me.rank}</span><span class="who"><b>${nameHTML(me)}</b>${me.message ? `<span class="m">${esc(me.message)}</span>` : ""}</span></div>` : "";
  $("#boardfull").innerHTML = e.length ? podium(e) + ranks(e, 3, e.length, true) : emptyBoard();
  $("#removebox").innerHTML = board.joined ? `<button class="link" data-act="remove">${T.removeMe}</button>` : "";
}

const product = id => (state.products || []).find(p => p.id === id);
// Product ids for a tier: native's tiers list where it gives one, else the usual names.
const tierId = (cad, i) => state.tiers ? state.tiers[cad === "m" ? "monthly" : "oneTime"][i] : `support_${cad === "m" ? "monthly" : "tip"}_${["sip", "small", "full"][i]}`;
function selected() {
  if (tier === 3) { const unit = product(state.tiers?.custom || "support_tip_unit"); return unit && { id: unit.id, price: "$" + dollars, cents: unit.baseCents * dollars }; }
  const p = product(tierId(cadence, tier));
  return p && { id: p.id, price: p.price, cents: p.baseCents };
}
const LEVELS = [.2, .45, .75];
function drawTiers() {
  $("#cadence").classList.toggle("right", cadence === "o");
  document.querySelectorAll("#cadence button").forEach(b => b.classList.toggle("on", b.dataset.cad === cadence));
  if (cadence === "m" && tier === 3) tier = 0;
  const rows = T.tiers.map(([nm, ln], i) => {
    const p = product(tierId(cadence, i)), on = i === tier;
    return `<button class="tier${on ? " on" : ""}" data-tier="${i}">${cup(on ? 0 : LEVELS[i], 30)}<span><div class="nm">${nm}</div><div class="ln">${ln}</div>${on && cadence === "m" ? `<div class="when">${T.monthlyNote}</div>` : ""}</span><span class="pr">${p ? p.price : ""}</span></button>`;
  });
  if (cadence === "o") rows.push(`<button class="tier" data-go="custom">${cup(0, 30, { dashed: true })}<span><div class="nm">${T.custom[0]}</div><div class="ln">${T.custom[1]}</div></span><svg class="chev" width="22" height="22" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`);
  $("#tiers").innerHTML = rows.join("");
  // The selected cup fills from empty to its level.
  const fill = $("#tiers .tier.on .fill");
  if (fill) setTimeout(() => { fill.style.transform = `scaleY(${LEVELS[tier]})`; }, reduce ? 0 : 40);
  drawPay($("#pay"));
}
/** The pay button: Chip in and the price, and under it the place it buys (hidden when the server can't say). */
async function drawPay(button) {
  const s = selected();
  if (!s) { button.innerHTML = T.notReady; return; }
  const head = `<span>${T.chipIn} · ${s.price}</span>`;
  button.innerHTML = head;
  $("#payerr").textContent = state.billing !== "ready" ? T.billing : "";
  const r = await api.preview(s.cents).catch(() => ({ available: false }));
  if (!r.available) return;
  button.innerHTML = `${head}<span class="sub">${T.putsYou(r.rank, r.myRank)}</span>`;
  if (lastRank !== null && lastRank !== r.rank) button.querySelector(".sub b").classList.add("bump");
  lastRank = r.rank;
}
function drawCustom() {
  tier = 3; cadence = "o";
  const s = $("#slider"); s.value = dollars; s.style.setProperty("--p", ((dollars - 1) / 49 * 100) + "%");
  const cups = dollars / 5;
  $("#custd").textContent = "$" + dollars;
  $("#custc").textContent = "about " + cupsText(cups);
  $("#custpot").textContent = cups > 5 ? T.wholePot : "";
  // Up to five cups side by side; past that, one big cup and the count.
  const whole = Math.ceil(cups - .001);
  $("#custcups").innerHTML = whole > 5 ? `${cup(1, 96)}<span class="times">×${cupsText(cups).replace(/ cups?$/, "")}</span>`
    : Array.from({ length: Math.max(1, whole) }, (_, i) => cup(Math.min(1, cups - i), whole > 3 ? 64 : whole > 1 ? 84 : 104)).join("");
  drawPay($("#pay2"));
}

// The popup: one stat leads, three follow; all count up.
function drawPopup(stats) {
  const shown = stats.map((n, i) => [n, T.tiles[i]]).filter(([n]) => n > 0);
  if (!shown.length) { $("#stats").innerHTML = ""; return; }
  const [lead, ...rest] = shown;
  $("#stats").innerHTML = `<div class="herostat"><b data-to="${lead[0]}">0</b><span>${lead[1]}</span></div>
    <div class="smallstats">${rest.slice(0, 3).map(([n, l]) => `<div class="smallstat"><b data-to="${n}">0</b><span>${l}</span></div>`).join("")}</div>`;
  const start = performance.now();
  const f = now => {
    const t = reduce ? 1 : (now - start - 250) / 1300, e = ease(t);
    document.querySelectorAll("#stats b").forEach(b => { b.textContent = Math.round(+b.dataset.to * e).toLocaleString("en"); });
    if (t < 1) frame(f);
  };
  frame(f);
}

// The thank-you: the gradient rises to the total (a cup fills the screen) and floods past it; the cup and the amount count up
// with it; then the title, and 600ms later the fun fact.
let raf;
function thanks(totalCups, rank, after) {
  const view = $("#thanks"), flood = $("#flood"), H = view.clientHeight || 770;
  const target = Math.min(1.1, Math.max(.35, totalCups)) * H;
  view.classList.remove("settled");
  view.classList.toggle("dark-words", target > H * .62);
  $("#bubbles").innerHTML = Array.from({ length: 14 }, () => {
    const size = 4 + Math.random() * 10;
    return `<span class="bubble" style="left:${Math.random() * 96}%;width:${size}px;height:${size}px;opacity:${(.25 + Math.random() * .35).toFixed(2)};animation-duration:${(1.2 + Math.random() * 1.2).toFixed(2)}s;animation-delay:${(Math.random() * 2.4).toFixed(2)}s"></span>`;
  }).join("");
  $("#thankscup").innerHTML = cup(0, 64);
  $("#thanksactions").innerHTML = after;
  clearTimeout(raf);
  const start = performance.now(), D = 2000, fill = $("#thankscup .fill");
  const f = now => {
    const t = reduce ? 1 : (now - start) / D, e = ease(t);
    flood.style.height = (e * target) + "px";
    fill.style.transition = "none"; fill.style.transform = `scaleY(${Math.min(1, totalCups) * e})`;
    $("#amount").textContent = T.amount(totalCups * e, t >= 1 ? rank : null);
    if (t < 1) raf = frame(f); else { $("#amount").textContent = T.amount(totalCups, rank); view.classList.add("settled"); }
  };
  raf = frame(f);
}

function drawOptin(rank) {
  const n = limitAt(rank), t = tierAt(rank);
  $("#limit").innerHTML = `<span class="badge">${t ? "Top " + t : "Beyond 100"}</span><span>${esc(T.limits[t])}</span>`;
  $("#msgfield").style.display = n ? "" : "none";
  const name = $("#name"), msg = $("#msg");
  msg.maxLength = n || 0;
  const count = () => {
    $("#namecount").textContent = `${name.value.length}/40`;
    $("#msgcount").textContent = `${msg.value.length}/${n}`; $("#msgcount").classList.toggle("full", msg.value.length >= n);
    $("#optpreview").innerHTML = `<div class="kicker">${T.previewLabel}</div>` + ranks([{ id: "p", rank, name: name.value || null, message: n ? msg.value.slice(0, n) || null : null, you: true }], 0, 1, false);
  };
  name.oninput = msg.oninput = count; count();
}

function toast(text) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = text;
  $("#app").appendChild(el); setTimeout(() => el.remove(), 2200);
}

// ---------- Navigation. ----------
function show(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id));
  const v = $("#" + id); if (v) v.scrollTop = 0;
}
document.addEventListener("click", async ev => {
  const go = ev.target.closest("[data-go]"); if (go) { route(go.dataset.go); return; }
  const cad = ev.target.closest("[data-cad]"); if (cad) { cadence = cad.dataset.cad; drawTiers(); return; }
  const t = ev.target.closest("[data-tier]"); if (t) { tier = +t.dataset.tier; drawTiers(); return; }
  const rep = ev.target.closest("[data-report]");
  if (rep) { const li = rep.closest(".rank"); if (!li.querySelector(".reportbox")) li.insertAdjacentHTML("beforeend", `<div class="reportbox"><button data-confirm="${rep.dataset.report}">${T.report}</button></div>`); return; }
  const conf = ev.target.closest("[data-confirm]");
  if (conf) { conf.parentElement.remove(); await api.report(conf.dataset.confirm).catch(() => {}); toast(T.reported); return; }
  const act = ev.target.closest("[data-act]")?.dataset.act;
  if (act === "nah") api.nah();
  if (act === "add" || act === "anon") { await api.join(act === "anon", $("#name").value.trim(), $("#msg").value.trim()).catch(() => {}); SAMPLE.joined = true; route("fund"); }
  if (act === "remove") { await api.remove().catch(() => {}); SAMPLE.joined = false; route("board"); }
  if (act === "later") route("support");
  if (act === "write") route("optin");
  if (act === "retry") route(document.querySelector(".view.on").id === "board" ? "board" : "support");
});
// Chip in: Play takes over. The thank-you comes with the receipt event (in the samples, at once).
$("#pay").onclick = $("#pay2").onclick = async () => {
  const s = selected(); if (!s) return;
  const r = await api.buy(s.id, tier === 3 ? dollars : 1).catch(() => ({ result: "unavailable" }));
  if (r.result === "unavailable") $("#payerr").textContent = T.billing;
  if (!native) paid(s.cents);
};
$("#slider").oninput = e => { dollars = +e.target.value; drawCustom(); };
for (const id of ["support", "board", "settings"]) $("#" + id).addEventListener("scroll", e => e.target.querySelector(".bar").classList.toggle("scrolled", e.target.scrollTop > 60));

/** After a payment: the thank-you, then the opt-in, or the move-up invite for someone already on the board. */
function afterPayment(totalCups, rank, before, joined, forceMoveUp) {
  const movedUp = forceMoveUp ?? (joined && rank && tierAt(rank) && tierAt(rank) < (tierAt(before) || 999));
  const actions = movedUp ? `<div class="invite">${esc(T.invite(tierAt(rank)))}</div><button class="primary" data-act="write">${T.writeMore}</button><button class="quiet" data-act="later">${T.later}</button>`
    : joined ? `<button class="primary" data-go="fund">${T.supporters}</button>`
    : `<button class="primary" data-go="optin">${T.join}</button><button class="quiet" data-act="later">${T.later}</button>`;
  show("thanks"); thanks(totalCups, rank, actions);
  drawOptin(rank || 101);
}
function paid(cents, opts = {}) {
  const before = SAMPLE.joined ? sampleRank(0) : null, after = sampleRank(cents);
  afterPayment(opts.cups ?? (SAMPLE.mine + cents) / 500, after, before, SAMPLE.joined, opts.moveUp);
}
events.receipt = async receipt => {
  const r = await api.preview(0).catch(() => ({ available: false }));
  afterPayment((receipt.totalCents ?? state.totalCents) / 500, r.available ? r.rank : null, board.myRank ?? null, !!board.joined);
};
events.state = data => { state = data; reduce = reduce || !!data.reduceMotion; drawTiers(); };

async function route(id) {
  // In the app, Settings is behind this screen: going back closes it.
  if (id === "settings" && native) { api.close(); return; }
  if (id === "support") { board = await api.board(); state = await api.state(); drawBoardPreview(); drawTiers(); }
  if (id === "board" || id === "fund") { board = await api.board(); drawBoardFull(id === "fund"); show("board"); return; }
  if (id === "custom") drawCustom();
  if (id === "popup") { if (native) state = await api.state(); drawPopup(await api.stats()); }
  if (id === "optin") drawOptin(sampleRank(selected()?.cents || 0));
  show(id);
}

// ---------- Start, and the render states (?state=...). ----------
fillText();
const q = new URLSearchParams(location.search);
if (q.get("reduce")) { reduce = true; document.documentElement.classList.add("reduce"); }
if (q.get("empty")) SAMPLE.empty = true;
if (q.get("offline")) SAMPLE.offline = true;
if (q.get("joined")) SAMPLE.joined = true;
if (q.get("cad")) cadence = q.get("cad");
if (q.get("tier")) tier = +q.get("tier");
if (q.get("dollars")) dollars = +q.get("dollars");
(async () => {
  // Native opens #page or #popup.
  const s = { page: "support" }[location.hash.slice(1)] || q.get("state") || location.hash.slice(1) || "support";
  if (s === "thanks") { await route("support"); paid(selected().cents, { cups: q.get("cups") ? +q.get("cups") : undefined, moveUp: q.get("moveup") ? true : undefined }); }
  else if (s === "optin") {
    show("optin"); const rank = +(q.get("rank") || 8); drawOptin(rank);
    if (q.get("fill")) { $("#name").value = "Maximilian Alexander von Hohenzollern"; $("#msg").value = L120.slice(0, limitAt(rank)); $("#name").dispatchEvent(new Event("input")); }
  }
  else if (s === "checkout") {
    await route("support");
    const sel = selected();
    $("#overlay").innerHTML = `<div class="scrim"><div class="checkout"><div class="grab"></div><div class="kicker">Test checkout · Debug</div>
      <div class="row"><span>${esc(T.tiers[tier][0])} · ${cadence === "m" ? T.monthly : T.oneTime}</span><b>${sel.price}</b></div>
      <p>Sample payment. No charge.</p><button class="primary">Confirm</button></div></div>`;
  }
  else await route(s);
  if (q.get("scroll")) { const v = document.querySelector(".view.on"); v.scrollTop = { mid: (v.scrollHeight - v.clientHeight) / 2, bottom: v.scrollHeight }[q.get("scroll")] ?? +q.get("scroll"); v.dispatchEvent(new Event("scroll")); }
  if (q.get("report")) document.querySelector("[data-report]")?.click();
})();
</script>
</body>
