<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The window fills the screen, the camera cutout's band included; the app tells the page its height (--cut). -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // The page is laid out at its design width, 690 CSS px (the renders and reviews were made at it), and zoomed to the screen:
  // CSS zoom changes the layout, so everything stays crisp and in proportion (a WebView zoomed to fit drew layers stretched).
  // getBoundingClientRect is zoomed; offset and client sizes aren't (see ZOOM below).
  window.ZOOM = 1;
  const fitZoom = () => { window.ZOOM = innerWidth / 690; document.documentElement.style.zoom = window.ZOOM; };
  // The camera cutout's height in phone pixels, from the app: --cut keeps the page's controls below the camera while its
  // backgrounds fill the band (owner, 2026-11-20: "we shdn't leave the top of the screen empty").
  let cutPx = 0;
  const setCut = () => document.documentElement.style.setProperty("--cut", cutPx / devicePixelRatio / window.ZOOM + "px");
  window.titankeysCut = px => { cutPx = +px || 0; setCut(); };
  fitZoom(); addEventListener("resize", () => { fitZoom(); setCut(); });
  // Settings > Accent colour (#111): the app tells the page its accent, already checked to read on black (Accent.kt).
  window.titankeysAccent = hex => {
    if (!/^#[0-9A-F]{6}$/i.test(hex)) return;
    const style = document.documentElement.style;
    style.setProperty("--accent", hex); style.setProperty("--accent-soft", hex + "24");
  };
</script>

<title>Support TitanKeys</title>
<!--
  TitanKeys' support screens, round 2 (support-app.html). Ships as an offline asset in a full-screen WebView: local fonts only,
  no network, and all data through G's bridge (window.TitanKeysSupport.post / window.titankeysSupport.receive). Without the
  bridge it runs on the SAMPLE data below, so it previews on its own: support-app.html?state=... for each render.
  The Titan's square screen: 1076 x 1200 px, about 690 x 770 CSS px. Words: F's docs/support-text.md (47a38854).
  Round 11 follows the review of round 10 (support-review-r10.md): measured spacing; round 10 followed the review of round 9 (support-review-r9.md); round 9 followed the review of round 8 (support-review-r8.md); round 8 followed the review of round 7 (support-review-r7.md); round 7 followed the review of round 6 (support-review-r6.md); round 6 followed the review of round 5 (support-review-r5.md); round 5 followed the review of round 4 (support-review-r4.md); round 4 followed the review of round 3 (support-review-r3.md, with the Master's overrides); round 3 followed the review of round 2 (support-review-r2.md) and a motion pass; round 2 followed the review of round 1 (X:\Atlas\.dev\support-review-r1.md): bugs, a smaller pay dock with the rank
  as its hero, a thank-you that peaks, a content-sized podium, a supporters' board that rewards, anchored empty screens, a 15px
  text floor, and tier and custom polish.
-->
<style>
  @font-face { font-family: Inter; src: url(inter_regular.otf); font-weight: 400; }
  @font-face { font-family: Inter; src: url(inter_bold.otf); font-weight: 700; }
  :root {
    /* Colour: pure black, one orange, greys no darker than #8A8480 for text. */
    --bg: #000; --s1: #0F0B09; --s2: #1A1310; --s3: #1E1410; --line: #2E2925; --line-strong: #5A534E;
    --ink: #FFF1E6; --body: #D9D2CC; --muted: #A39B94; --dim: #8A8480;
    --accent: #F07C4A; --accent-soft: #F07C4A24; --on-accent: #1A0F0A; --deep: #2A120A;
    /* Type: nothing under 15px. 15 · 16 · 18 · 22 · 26 · 32 · 40 · 56 · 72. */
    --t-xs: 15px; --t-s: 16px; --t-m: 18px; --t-l: 22px; --t-xl: 26px; --t-2xl: 32px; --t-3xl: 40px; --t-4xl: 56px; --t-5xl: 72px;
    /* Spacing: 4-based. Side margin 33px = 52px on the phone. */
    --g1: 4px; --g2: 8px; --g3: 12px; --g4: 16px; --g5: 24px; --g6: 32px; --g7: 48px;
    --side: 33px; --r-s: 12px; --r-m: 18px; --r-l: 24px;
    --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.3, 1.35, .5, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 400 var(--t-m)/1.45 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-wrap: pretty; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .app { position: relative; width: 100%; height: 100%; margin: 0 auto; overflow: hidden; background: #000; }
  .view { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; display: none; padding-top: var(--cut, 0px); }
  .view::-webkit-scrollbar { display: none; }
  html, body, .view { overscroll-behavior: none; }
  /* In the app, the popup is a see-through window over the real front page: no drawn front page, a dim scrim instead. */
  html.see-through, html.see-through body, html.see-through .app { background: transparent; }
  html.see-through #popup { background: #000000A6; }
  html.see-through #popup .front { display: none; }
  .view.on { display: block; animation: enter .32s var(--ease); }
  .view.fill.on { display: flex; flex-direction: column; }
  @keyframes enter { from { opacity: 0; top: 10px; } }
  .pad { padding: 0 var(--side); }

  /* Every top bar is solid black, with a 24px fade under it, so nothing ghosts through. */
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: var(--g3); height: 64px; padding: 0 var(--side); background: #000; flex: none; }
  .bar::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 24px; background: linear-gradient(#000, #0000); pointer-events: none;
    opacity: 0; }
  .bar.scrolled::after { opacity: 1; }
  .bar .back { width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
  .bar .back svg { width: 24px; height: 24px; }
  .bar .title { font-weight: 700; font-size: var(--t-m); opacity: 0; }
  .bar.scrolled { background: #000; box-shadow: 0 1px 0 var(--line); }
  .bar.scrolled::after { opacity: 1; height: 28px; }
  /* No title swap on scroll (owner: it flickered while changing size): the big title scrolls away under the bar's fade,
     and the bar keeps only the back arrow. */
  h1 { margin: 0; font-size: var(--t-3xl); line-height: 1.1; letter-spacing: -.02em; font-weight: 700; }
  .intro { margin: var(--g3) 0 0; color: var(--body); font-size: var(--t-m); line-height: 1.45; max-width: 34ch; }
  .kicker { color: var(--accent); font-size: var(--t-xs); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .lede { color: var(--muted); font-size: var(--t-m); margin: var(--g2) 0 0; }
  .muted { color: var(--muted); }
  .clip1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clip2, .clip3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .clip2 { -webkit-line-clamp: 2; } .clip3 { -webkit-line-clamp: 3; }

  /* Buttons. */
  .primary { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 60px; padding: 8px 16px;
    border-radius: 32px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: var(--t-l); line-height: 1.2;
    opacity: var(--fade); transition: --fade .15s var(--ease); }
  .primary:active { --fade: .86; }
  .primary:disabled { --fade: .4; }
  .chev-down { position: relative; animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { top: 3px; } }
  .primary .sub { font-size: var(--t-xs); font-weight: 400; opacity: .85; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .primary .sub b { font-weight: 700; display: inline-grid; vertical-align: baseline; overflow: hidden; line-height: 1.2; height: 1.2em; }
  .primary .sub b > span { grid-area: 1 / 1; position: relative; }
  .primary .sub b .old { animation: rollout .4s var(--ease) forwards; }
  .primary .sub b .new { animation: rollin .5s cubic-bezier(.2, .9, .3, 1.2); }
  .primary .sub .from { font-weight: 400; }
  @keyframes rollout { to { top: -1.3em; opacity: 0; } }
  @keyframes rollin { from { top: 1.3em; opacity: 0; } }
  .quiet { display: block; width: 100%; height: 52px; color: var(--muted); font-weight: 700; font-size: var(--t-m); }
  .link { color: #9A8F88; font-size: var(--t-s); font-weight: 700; }

  /* The cup, drawn like the guide: cream outline, orange coffee that rises from the bottom. */
  .cup { display: block; overflow: visible; }
  .cup .stroke { fill: none; stroke: var(--ink); stroke-width: 2.2px; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
  .cup .dash { stroke-dasharray: 2.2 2; }
  .cup .plus { stroke: var(--muted); stroke-width: 1.6px; stroke-linecap: round; }
  .cup.pick { position: relative; animation: cuppick .45s var(--spring); }
  @keyframes cuppick { 40% { top: -4px; } }
  .cup .fill { fill: var(--accent); transform-box: fill-box; transform-origin: 50% 100%; transition: transform .7s cubic-bezier(.3, 1.25, .5, 1); }
  .steam path { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; stroke-dasharray: 14; animation: steam 2.8s ease-in-out infinite; }
  .steam path + path { animation-delay: 1.1s; }
  @keyframes steam { 0% { stroke-dashoffset: 14; opacity: 0; } 35% { opacity: .9; } 100% { stroke-dashoffset: -14; opacity: 0; } }

  /* ---------- Settings: the card at the very bottom. ---------- */
  .srow { display: flex; justify-content: space-between; align-items: center; height: 64px; border-bottom: 1px solid var(--line); font-size: var(--t-l); }
  .srow span { color: var(--muted); font-size: var(--t-m); }
  .ssec { margin: var(--g6) 0 var(--g2); }
  .coffeecard { position: relative; display: flex; align-items: center; gap: var(--g4); width: 100%; margin: var(--g6) 0 var(--g7); padding: var(--g5);
    border-radius: var(--r-l); background: radial-gradient(120% 140% at 0% 0%, #2A150B, var(--s1) 60%); text-align: left; isolation: isolate; }
  .coffeecard::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; z-index: -1;
    background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 55%, #000) 50%, var(--accent) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  }
  @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --spin: 360deg; } }
  .coffeecard .t { font-weight: 700; font-size: var(--t-xl); }
  .coffeecard .s { color: var(--muted); font-size: var(--t-s); }
  .coffeecard .go { margin-left: auto; flex: none; color: var(--accent); }

  /* ---------- The popup: a true bottom sheet over the front page. ---------- */
  .front { padding: 26px var(--side); filter: brightness(.32) blur(2px); }
  .front .logo { font-weight: 700; font-size: var(--t-xl); } .front .logo b { color: var(--accent); }
  .front .prompt { font-weight: 700; font-size: var(--t-2xl); margin: 40px 0 var(--g2); text-transform: uppercase; }
  .front .box { height: 120px; border-radius: var(--r-m); background: var(--s2); border-left: 3px solid var(--accent); margin-top: var(--g5); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--g3) var(--side) var(--g4); border-radius: 28px 28px 0 0;
    background: var(--s2); border-top: 1px solid var(--line); box-shadow: 0 -24px 80px #000; animation: up .5s var(--ease); }
  @keyframes up { from { bottom: -100%; } }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 0 auto var(--g5); }
  .sheet .head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--g4); }
  .sheet .head .cupslot { margin-top: -18px; }
  .sheet .head .steam { --fade: 0; opacity: var(--fade); transition: --fade .6s; }
  .sheet .head.full .steam { --fade: 1; }
  .sheet .after { color: var(--body); font-size: var(--t-m); margin: 0 0 var(--g4); text-wrap: balance; }
  .sheet .line { font-size: var(--t-2xl); font-weight: 700; line-height: 1.12; letter-spacing: -.01em; }
  .herostat { position: relative; margin-top: var(--g5); animation: rise .5s var(--ease) backwards; }
  .herostat b { display: block; font-size: var(--t-4xl); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .herostat span { display: block; margin-top: 9px; color: #A89C94; font-size: var(--t-xs); }
  .smallstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--g2); margin: var(--g5) 0 var(--g5); }
  .smallstat { position: relative; padding: var(--g3) var(--g4); border-radius: var(--r-m); background: var(--s1); animation: rise .5s var(--ease) backwards; min-width: 0; }
  .smallstat:nth-child(2) { animation-delay: .08s; } .smallstat:nth-child(3) { animation-delay: .16s; }
  .smallstat b { display: block; font-size: var(--t-2xl); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .smallstat span { color: #A89C94; font-size: var(--t-xs); }

  /* ---------- The support page. ---------- */
  .hero { padding: var(--g2) var(--side) 0; }
  .points { list-style: none; margin: var(--g4) 0 0; padding: 0; display: grid; gap: var(--g2); }
  .points li { display: flex; gap: var(--g3); align-items: baseline; color: #E8DED6; text-wrap: balance; }
  .points li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); transform: translateY(-3px); }
  .section { margin-top: var(--g7); }
  .section + .section { margin-top: 40px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 var(--side); margin-bottom: var(--g5); }
  .section-head a { color: var(--accent); font-size: var(--t-s); font-weight: 700; cursor: pointer; }

  /* Podium: the top three, never cut. #1 is a full-width card with its crown; #2 and #3 share the row under it at one height.
     Each stacks from the top: the rank, 12px, the name, 8px, the message; spare room stays at the bottom.
     #1 lands first, then #2 and #3 rise, then the medals pop. */
  .podium { display: grid; grid-template-columns: 1fr 1fr; gap: var(--g3); padding: 28px var(--side) 0; }
  .place { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; min-width: 0;
    padding: var(--g5) var(--g4) var(--g5); border-radius: var(--r-l); background: var(--s1);
    animation: rise .6s cubic-bezier(.2, .9, .25, 1.05) backwards; }
  .place.p1 { grid-column: 1 / 3; order: -1; padding: var(--g6) var(--g6) var(--g5); border: 1.5px solid var(--accent);
    background: radial-gradient(90% 70% at 50% 0%, var(--accent-soft), var(--s1) 70%); animation: land .55s cubic-bezier(.2, .9, .25, 1.1) backwards; }
  .place.p2 { animation-delay: .14s; }
  .place.p3 { animation-delay: .24s; }
  .crown { position: absolute; top: -17px; left: 50%; width: 48px; height: 32px; transform: translateX(-50%); animation: crownpop .45s var(--spring) .35s backwards; }
  @keyframes crownpop { from { top: -34px; opacity: 0; } }
  @keyframes land { from { top: 18px; opacity: 0; } }
  @keyframes rise { from { top: 16px; opacity: 0; } }
  .medal { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: var(--t-s);
    border: 1.5px solid var(--line-strong); color: var(--ink); margin-bottom: var(--g3); font-variant-numeric: tabular-nums;
    position: relative; animation: pop .45s var(--spring) .45s backwards; }
  @keyframes pop { from { top: -8px; opacity: 0; } }
  .crown { transform: translateX(-50%); }
  .p1 .medal { width: 44px; height: 44px; background: var(--accent); border: 0; color: var(--on-accent); font-size: var(--t-m);
    box-shadow: 0 0 0 6px var(--accent-soft); animation-delay: .3s; }
  .place .name { font-weight: 700; font-size: var(--t-m); line-height: 1.25; width: 100%; overflow-wrap: break-word; hyphens: auto; text-wrap: balance; }
  .p1 .name { font-size: var(--t-xl); }
  .p1 .name.long { font-size: var(--t-l); }
  .place .msg { color: #C7BFB8; font-size: var(--t-s); line-height: 1.45; margin-top: var(--g2); width: 100%; text-wrap: pretty; }
  .p1 .msg { font-size: var(--t-m); max-width: 34ch; }
  .place.you { box-shadow: 0 0 0 2px var(--accent); }
  .podium.compact { grid-template-columns: 1fr 1.25fr 1fr; align-items: end; padding-top: 22px; }
  .podium.compact .place { padding: var(--g4) var(--g2) var(--g3); cursor: pointer; }
  .podium.compact .whole { display: none; white-space: normal; }
  .podium.compact .open .whole { display: block; } .podium.compact .open .short { display: none; }
  .podium.compact .place.p1 { grid-column: auto; order: 0; padding: var(--g5) var(--g3) var(--g4); }
  .podium.compact .place.p2 { margin-top: 18px; } .podium.compact .place.p3 { margin-top: 30px; }
  .podium.compact .medal { width: 28px; height: 28px; font-size: var(--t-xs); margin-bottom: var(--g2); }
  .podium.compact .p1 .medal { width: 34px; height: 34px; box-shadow: 0 0 0 4px var(--accent-soft); }
  .podium.compact .name { font-size: var(--t-s); }
  .podium.compact .p1 .name { font-size: var(--t-m); }
  .podium.compact .msg { font-size: var(--t-xs); line-height: 1.35; margin-top: var(--g1); }
  .podium.compact .p1 .msg { font-size: var(--t-xs); max-width: none; }
  .hero .points { gap: 4px; }
  #support .section { margin-top: var(--g4); }
  #support .section-head { margin-bottom: var(--g2); }
  #support h1 { font-size: var(--t-2xl); }
  #support .hero .points li { font-size: var(--t-s); }
  .podium.compact { padding-top: 18px; }

  .ranks { list-style: none; margin: var(--g4) 0 0; padding: 0 var(--side); }
  .rank { position: relative; display: grid; grid-template-columns: 32px 1fr; gap: var(--g4); align-items: start; padding: var(--g4) var(--g3);
    -webkit-user-select: none; user-select: none;
    border-bottom: 1px solid var(--line); animation: rise .45s var(--ease) backwards; }
  .rank .n { color: color-mix(in srgb, var(--accent) 85%, transparent); font-weight: 700; font-size: var(--t-m); font-variant-numeric: tabular-nums; line-height: 1.35; text-align: right; }
  .rank .who { min-width: 0; }
  .rank .who b { display: flex; align-items: center; font-size: var(--t-m); line-height: 1.35; min-width: 0; }
  .rank .who b .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank.you .who span.m { display: block; }
  .rank .who span.m { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
    color: var(--muted); font-size: var(--t-s); margin-top: 2px; }
  .rank.past10 .n { color: var(--dim); }
  .rank.pressed, .rank.held { background: #FFF1E612; border-radius: var(--r-s); transition: background .2s; }
  .sheetwrap { position: absolute; inset: 0; z-index: 9; background: #000000B3; animation: enter .2s; }
  .reportsheet { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--g3) var(--side) calc(24px + env(safe-area-inset-bottom));
    border-radius: 28px 28px 0 0; background: var(--s2); border-top: 1px solid var(--line); animation: up .3s var(--ease); }
  .reportsheet p { margin: var(--g5) 0 var(--g4); font-size: var(--t-l); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .outline { display: block; width: 100%; height: 56px; border-radius: 28px; border: 1.5px solid var(--line-strong); color: var(--ink); font-weight: 700; font-size: var(--t-m); }
  .reportsheet .quiet { margin-top: var(--g2); }
  .reportsheet p { margin-bottom: var(--g1); }
  .sheetbody { color: var(--muted); font-size: var(--t-s); margin-bottom: var(--g5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grouphead { padding: 0 var(--side); color: var(--accent); font-size: var(--t-xs); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .divider { height: 1px; background: var(--line-strong); margin: 15.4px 0 15.4px !important; list-style: none; }
  .divider + .rank { border-top: 0; }
  .rank:has(+ .divider), .rank:has(+ .tenrule) { border-bottom: 0; }
  /* The end of the top ten: one rule, 24px (15.4 CSS) above and below. */
  .tenrule { list-style: none; height: 1px; background: var(--line-strong); margin: 15.4px 0; padding: 0; }
  .tenrule + .rank { border-top: 0; }
  .divider::before, .divider::after { display: none !important; }
  .divider { display: block; align-items: center; gap: var(--g3); color: var(--accent); font-size: var(--t-xs); font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; list-style: none; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  /* Your row keeps the same indent as every other row: the panel is drawn outside it. */
  .rank.you { background: var(--s3); border-radius: var(--r-s); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); margin: 6px 0; }
  .rank.you .n { color: var(--accent); }
  .tag { flex: none; display: inline-flex; align-items: center; height: 22px; padding: 0 8px; margin-left: var(--g2); border-radius: 6px;
    background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; letter-spacing: .06em; line-height: 1; }
  /* Report: a popover anchored under the row that was held. */
  .popover { position: absolute; z-index: 3; right: 8px; top: 50%; translate: 0 -50%; display: flex; align-items: center; gap: var(--g2); padding: 6px;
    border-radius: 16px; background: var(--s2); border: 1px solid var(--line-strong); box-shadow: 0 12px 40px #000;
    animation: popin .22s var(--ease); }
  @keyframes popin { from { margin-top: -4px; opacity: 0; } }
  .popover::before { content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px; margin-top: -6px; background: var(--s2);
    border-left: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); transform: rotate(45deg); }
  .popover button { height: 40px; padding: 0 var(--g5); border-radius: 12px; color: var(--ink); font-size: var(--t-s); font-weight: 700; }
  .toast { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); padding: var(--g3) var(--g5); border-radius: 24px;
    background: var(--ink); color: var(--on-accent); font-weight: 700; font-size: var(--t-xs); white-space: nowrap; z-index: 9; animation: toastin .4s var(--spring); }
  @keyframes toastin { from { bottom: 108px; opacity: 0; } }

  /* Amounts. */
  .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; height: 52px; margin: 0 var(--side); padding: 4px; border-radius: 26px;
    background: var(--s1); border: 1px solid var(--line); }
  .seg .knob { position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px); border-radius: 22px; background: #2A211C;
    box-shadow: inset 0 0 0 1px #4A3D35;
    transition: left .35s var(--ease); }
  .seg.right .knob { left: 50%; }
  .seg button { position: relative; height: 100%; font-weight: 700; font-size: var(--t-m); color: var(--muted); transition: color .25s; }
  .seg button.on { color: var(--ink); }
  .tiers { display: grid; gap: var(--g2); margin: var(--g4) var(--side) 0; }
  .tier { display: grid; grid-template-columns: 40px 1fr auto; gap: var(--g4); align-items: center; padding: var(--g3) var(--g4);
    border-radius: var(--r-m); background: var(--s1); border: 1.5px solid var(--line); text-align: left;
    opacity: var(--fade); transition: border-color .2s, background .3s, --fade .15s var(--ease); }
  .tier:active { --fade: .86; }
  .tier.on { border-color: var(--accent); background: linear-gradient(90deg, #22120A, var(--s1)); }
  .tier .nm { font-weight: 700; font-size: var(--t-m); }
  .tier .ln { color: var(--muted); font-size: var(--t-xs); }
  .tier .pr { font-weight: 700; font-size: var(--t-m); color: #FFF1E6B3; font-variant-numeric: tabular-nums; transition: color .2s; }
  .tier.on .pr { color: var(--accent); }
  .tier .chev { color: var(--muted); }
  .tiernote { display: flex; align-items: center; gap: var(--g3); color: var(--muted); font-size: var(--t-xs); margin: 0 0 var(--g1); padding: 0 var(--g4); }
  .tiernote:empty { display: none; }
  .tiernote.row { min-height: 63px; margin: 0; padding: 0 var(--g4); border: 1.5px dashed var(--line); border-radius: var(--r-m); }
  .tiernote svg { flex: none; color: var(--muted); }
  .privacy { color: var(--dim); font-size: var(--t-xs); padding: var(--g6) var(--side) 0; }
  #board > .privacy { padding-bottom: 0; }
  #board .boardbar { margin-top: 0; padding-top: 20.5px; }
  #board .boardbar::before { display: none; }

  /* The pay dock: one button, with the rank it buys underneath its price. About 96px. */
  /* The one bottom dock: the same on every screen with a primary action, 20px above the safe area, a caption under it, and a
     40px fade that shows only while something scrolls beneath. */
  /* Screens with a pay bar are split: the header and the bar stay put, only the content between them scrolls (.scroll). In
     the app's WebView, a bar pinned over scrolling content (sticky or fixed) drew squeezed near the end of the scroll. */
  .view.split.on { display: flex; flex-direction: column; overflow: hidden; }
  .view.split > .bar { position: relative; }
  .view.split > .scroll { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: none; scrollbar-width: none; }
  .view.split > .scroll::-webkit-scrollbar { display: none; }
  .view.fill.split > .scroll { display: flex; flex-direction: column; }
  .view.split > .dock, .view.split .boardbar { margin-top: 0; }
  .dock, .boardbar { position: relative; z-index: 4; padding: var(--g4) var(--side) calc(20px + env(safe-area-inset-bottom)); background: #000; margin-top: var(--g6); }
  #support { scroll-padding-bottom: 140px; }
  .tiers { margin-bottom: 0; }
  #support .privacy { padding-top: 20.5px; }
  /* The fade over what scrolls beneath a dock changes colour, never opacity: at opacity 0 the WebView dropped the fade from
     the dock's layer, the layer shrank by 56px and drew the dock squashed flat at the list's end (the owner's phone,
     2026-11-20). */
  @property --cover { syntax: "<color>"; inherits: false; initial-value: #0000; }
  .dock::before, .boardbar::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 56px;
    background: linear-gradient(#0000, var(--cover) 32px); pointer-events: none; transition: --cover .2s; }
  .dock.covering::before, .boardbar.covering::before { --cover: #000; }
  .dock .primary { min-height: 62px; }
  .dock .err, .dock .note { text-align: center; color: #9A8F88; font-size: var(--t-xs); margin-top: var(--g2); min-height: 20px; }

  /* Custom: the cups, the amount and the slider as one centred group. */
  #custom .middle { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; padding: var(--g4) var(--side) 0; }
  .chip { display: inline-flex; align-items: center; height: 24px; padding: 0; margin-top: var(--g2); border: 0 !important; letter-spacing: .1em; text-transform: uppercase;
    border: 1px solid var(--line-strong); color: var(--muted); font-size: var(--t-xs); font-weight: 700; }
  .quick { display: flex; justify-content: center; gap: var(--g2); margin: var(--g5) 0 56px; }
  #custom .readout { position: static; }
  .quick button { height: 44px; min-width: 112px; padding: 0 var(--g4); border-radius: 22px; border: 1.5px solid var(--line-strong); font-weight: 700;
    font-variant-numeric: tabular-nums; transition: background .2s, border-color .2s, color .2s; }
  .quick button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .cups { display: flex; justify-content: center; align-items: flex-end; gap: var(--g3); height: 132px; }
  .cups .times { font-size: var(--t-3xl); font-weight: 700; color: var(--accent); margin-left: var(--g2); align-self: center; font-variant-numeric: tabular-nums; }
  .readout { text-align: center; margin-top: var(--g5); }
  .readout .d { display: inline-flex; align-items: center; gap: 2px; padding: 6px 20px 6px 24px; border-radius: 22px; background: var(--s1);
    border: 1.5px solid var(--line); cursor: text; font-size: var(--t-4xl); font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .readout .d .pencil { color: var(--ink); margin: -10px -14px -10px 0; padding: 10px; width: 48px; height: 48px; }
  .readout .d:focus-within { border-color: var(--accent); }
  .readout .d input { width: 1.3em; background: none; border: 0; outline: 0; color: var(--ink);
    font: inherit; text-align: center; font-variant-numeric: tabular-nums; caret-color: var(--accent); padding: 0; -moz-appearance: textfield; }
  .readout .d input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .readout .c { color: var(--accent); font-size: var(--t-l); margin-top: var(--g2); }
  /* In the flow under the cups, its line always kept so the slider never moves when it shows: placed from the bottom, it landed on
     "10 cups" on the phone (owner, 2026-11-21: "support screen bugged"). */
  .readout .pot { min-height: 1.3em; margin-top: var(--g2); color: var(--body); font-size: var(--t-m); line-height: 1.3; text-align: center; }
  #custom .slider { margin-top: 7px; }
  #custom .dock { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  .cups .times, .bigcup .times { font-size: 64px; line-height: .9; font-weight: 700; color: var(--accent); align-self: center; font-variant-numeric: tabular-nums; }
  .readout .rk { color: var(--muted); font-size: var(--t-s); height: 22px; font-variant-numeric: tabular-nums; }
  .readout .rk b { color: var(--accent); }
  .slider { margin-top: var(--g5); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 4px; margin: 0;
    background: linear-gradient(90deg, var(--accent) var(--p), var(--line) var(--p)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; background: var(--ink);
    border: 7px solid var(--accent); box-shadow: 0 0 0 8px var(--accent-soft); }
  .ticks { position: relative; height: 34px; margin-top: var(--g3); color: var(--muted); font-size: var(--t-xs); font-variant-numeric: tabular-nums; }
  .ticks { margin: var(--g3) 17px 0; }
  .ticks span { position: absolute; transform: translateX(-50%); padding-top: 10px; }
  .ticks span::before { content: ""; position: absolute; left: 50%; top: -2px; width: 1.5px; height: 8px; background: var(--line-strong); }


  /* Test checkout (Debug): a sheet like Play's over a plain black scrim. */
  .scrim { position: absolute; inset: 0; background: #000000B3; z-index: 8; animation: enter .25s; }
  .checkout { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--g3) var(--side) var(--g6); border-radius: 28px 28px 0 0;
    background: var(--s2); border-top: 1px solid var(--line); animation: up .4s var(--ease); }
  .checkout .row { display: flex; justify-content: space-between; align-items: last baseline; padding: var(--g4) 0; border-bottom: 1px solid var(--line); margin-top: var(--g3); }
  .checkout .row b { font-size: var(--t-xl); }
  .checkout p { color: var(--muted); font-size: var(--t-xs); margin: var(--g4) 0 var(--g5); }

  /* ---------- The thank-you: a warm rise, then the words, centred near 42%. ---------- */
  #thanks { background: #000; overflow: hidden; }
  .flood { position: absolute; left: -12px; right: -12px; bottom: 0; height: 0; will-change: height; }
  .flood .body { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(0deg, color-mix(in srgb, var(--accent) 90%, #000) 0%, var(--accent) 30%, color-mix(in srgb, var(--accent) 70%, #FFF1E6) 70%, color-mix(in srgb, var(--accent) 35%, #FFF1E6) 100%); }
  .flood svg { position: absolute; left: 0; top: -30px; width: 200%; height: 32px; animation: wave 3.4s linear infinite; }
  .flood .foam { stroke-width: 7px; vector-effect: non-scaling-stroke; opacity: .95; }
  @keyframes wave { to { left: -100%; } }
  /* Play's prices on their way: three soft dots in the pay button (owner, 2026-11-24: "a subtle loading animation"). */
  .waitdots { display: inline-flex; gap: 8px; align-items: center; height: 1em; }
  .waitdots i { position: relative; top: 0; width: 8px; height: 8px; border-radius: 50%; background: color-mix(in srgb, currentColor 25%, transparent); animation: waitdot 1.2s ease-in-out infinite; }
  .waitdots i:nth-child(2) { animation-delay: .2s; } .waitdots i:nth-child(3) { animation-delay: .4s; }
  /* Colour and position, never opacity or transform: see tools/checks/support-web.test.ts. */
  @keyframes waitdot { 40% { background: color-mix(in srgb, currentColor 80%, transparent); top: -2px; } }
  .reduce .waitdots i { animation: none; background: color-mix(in srgb, currentColor 50%, transparent); }
  /* The monthly coffee you have: a quiet card under the coffees, its words on the left and Manage on the right, centred. */
  .mymonthly { display: flex; align-items: center; justify-content: space-between; gap: var(--g4); margin: var(--g2) var(--side) 0;
    padding: var(--g3) var(--g4); border-radius: var(--r-m); border: 1.5px dashed var(--line); color: var(--dim); font-size: var(--t-s); }
  .mymonthly .link { flex: none; color: var(--accent); padding: 8px 0 8px 12px; }
  #pay.owned { filter: saturate(.4); }
  .bubble { position: absolute; bottom: -16px; border-radius: 50%; background: #FFF4E8; animation: bubble linear infinite; }
  /* Bubbles rise by position, not transform: on the phone, transform-animated bubbles made the WebView draw the whole
     thank-you squeezed or stretched. */
  @keyframes bubble { from { bottom: -16px; } to { bottom: 884px; } }
  #thanks.on { display: flex; flex-direction: column; }
  /* Fades go through --fade, not opacity itself: an opacity transition went to its own layer on the phone's
     WebView and drew small or narrow until it ended (2026-11-20). */
  @property --fade { syntax: "<number>"; inherits: false; initial-value: 1; }
  .drifts { position: absolute; inset: 0; pointer-events: none; z-index: 1; --fade: 0; opacity: var(--fade); transition: --fade .8s; }
  .settled .drifts { --fade: .8; }
  .drift { position: absolute; animation: drift 4.5s ease-in-out infinite alternate; }
  .drift .cup .stroke { stroke: #1A1210; stroke-width: 1.6px; }
  @keyframes drift { from { margin-top: 0; margin-left: -4px; } to { margin-top: -40px; margin-left: 4px; } }
  #thanks.invite .thanks-words { padding-bottom: 46px; }
  .thanks-words { position: relative; flex: 1; padding: var(--g6) var(--side) 112px; text-align: center; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .thanks-words .bigcup { margin-bottom: var(--g4); display: flex; align-items: baseline; gap: 10px; border-radius: 50%; }
  .thanks-words .bigcup.mark { animation: markpulse .65s var(--ease); }
  @keyframes markpulse { 30% { top: -6px; } 100% { top: 0; } }
  .thanks-words .bigcup.mark::before { content: ""; position: absolute; left: 50%; top: 50%; width: var(--glow, 160px); height: var(--glow, 160px);
    margin: calc(var(--glow, 160px) / -2) 0 0 calc(var(--glow, 160px) / -2); border-radius: 50%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 18%, transparent) 55%, color-mix(in srgb, var(--accent) 0%, transparent)); z-index: -1; opacity: var(--fade); animation: glow .65s var(--ease) forwards;
    clip-path: inset(var(--glowclip, 0px) 0 0 0); }
  @keyframes glow { from { --fade: 0; } 40% { --fade: 1; } to { --fade: 0; } }
  .bigcup.mark.pinned::before { animation: none; --fade: 1; }
  .thanks-words .bigcup.mark::after { content: ""; position: absolute; left: 50%; top: 50%; width: var(--ring, 96px); height: var(--ring, 96px);
    margin: calc(var(--ring, 96px) / -2) 0 0 calc(var(--ring, 96px) / -2); z-index: -1;
    border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); animation: ring .65s var(--ease) forwards; }
  @keyframes ring {
    from { width: calc(var(--ring, 96px) * .85); height: calc(var(--ring, 96px) * .85); margin: calc(var(--ring, 96px) * -.425) 0 0 calc(var(--ring, 96px) * -.425); opacity: 1; }
    to { width: calc(var(--ring, 96px) * 1.25); height: calc(var(--ring, 96px) * 1.25); margin: calc(var(--ring, 96px) * -.625) 0 0 calc(var(--ring, 96px) * -.625); opacity: 0; } }
  .thanks-words .bigcup { position: relative; }
  .confetti { position: absolute; left: 50%; top: 40%; margin-left: -9px; rotate: var(--r); animation: burst 1.1s cubic-bezier(.15, .8, .3, 1) forwards; }
  .confetti.pinned { animation: none; transform: translate(calc(var(--x) * .8), calc(var(--y) * .8)) rotate(var(--r)); }
  .bigcup.mark.pinned { animation: none; transform: scale(1.08); }
  .bigcup.mark.pinned::after { animation: none; transform: none; opacity: 1; }
  .bigcup.onblack::before { display: none; }
  @keyframes burst { from { margin-left: -9px; margin-top: 0; opacity: 1; } 70% { opacity: 1; } to { margin-left: calc(var(--x) - 9px); margin-top: var(--y); opacity: 0; } }
  .thanks-words .bigcup svg { align-self: flex-end; }
  .thanks-words .bigcup b { font-size: var(--t-4xl); line-height: .8; letter-spacing: -.02em; align-self: flex-end; }
  .thanks-words h1 { position: relative; top: 16px; font-size: var(--t-5xl); letter-spacing: -.03em; --fade: 0; opacity: var(--fade); transition: --fade .6s, top .6s var(--ease); }
  .thanks-words .amount { font-size: var(--t-xl); font-weight: 700; margin-top: var(--g3); font-variant-numeric: tabular-nums; --fade: 0; opacity: var(--fade); transition: --fade .5s .1s; }
  .thanks-words .total { font-size: var(--t-m); margin-top: 2px; font-variant-numeric: tabular-nums; --fade: 0; opacity: var(--fade); transition: --fade .5s .3s; }
  .settled .thanks-words .total { --fade: .8; }
  .thanks-words p { font-size: var(--t-m); line-height: 1.4; margin: var(--g4) auto 0; max-width: 30ch; text-wrap: balance; --fade: 0; opacity: var(--fade);
    position: relative; top: 10px; transition: --fade .6s .6s, top .6s .6s var(--ease); }
  .settled .thanks-words h1, .settled .thanks-words .amount { --fade: 1; top: 0; }
  .settled .thanks-words p { --fade: 1; top: 0; }
  .dark-words .thanks-words p { color: #2A1208; }
  .dark-words .thanks-words { color: var(--on-accent); }
  .thanks-words .cup .stroke { stroke: var(--ink); }
  .settled .thanks-words .cup .stroke, .dark-words .thanks-words .cup .stroke { stroke: #1A1210; stroke-width: 3px; }
  .dark-words .thanks-words .cup .fill { fill: #FFF1E6; }
  .thanks-actions { position: relative; padding: 0 var(--side) calc(20px + env(safe-area-inset-bottom)); z-index: 2; display: grid; gap: var(--g2);
    --fade: 0; opacity: var(--fade); top: 12px; transition: --fade .5s .9s, top .5s .9s var(--ease); }
  .settled .thanks-actions { --fade: 1; top: 0; }
  .progress { margin-bottom: 7.4px; color: var(--on-accent); }
  .progress .pl { display: flex; justify-content: space-between; align-items: baseline; gap: var(--g3); }
  .progress .pl b { font-size: var(--t-m); font-variant-numeric: tabular-nums; }
  .progress .pl span { font-size: var(--t-xs); color: #2A1208; }
  .progress .segbar { display: flex; gap: 4px; margin-top: 7.7px; }
  .progress .segbar i { flex: 1; height: 6px; border-radius: 3px; background: #2A120840; }
  .progress .segbar i.here { background: var(--on-accent); }
  .thanks-actions { align-content: end; }
  .thanks-actions .primary { background: var(--on-accent); color: var(--ink); }
  .thanks-actions .progress + .primary { margin-top: 0; }
  .thanks-actions .quiet { color: var(--deep); }

  /* ---------- Opt-in: fields up top, the buttons anchored at the bottom. ---------- */
  #optin .content { padding: 0 var(--side) 0; }
  #optin .content .fields { margin-top: 15.4px; }
  #optin .content .fields .field:first-child { margin-top: 0; }
  #optin .dock { position: static; margin-top: 0; padding-top: 25px; }
  #optin .actions { display: grid; gap: var(--g1); margin-top: 0; }
  .field { margin-top: var(--g4); padding: var(--g3) var(--g4); border-radius: var(--r-m); background: var(--s1); border: 1.5px solid var(--line); }
  .field:focus-within { border-color: var(--accent); }
  .field label { display: flex; justify-content: space-between; color: var(--muted); font-size: var(--t-xs); font-weight: 700; }
  .field label .count { font-variant-numeric: tabular-nums; font-weight: 400; }
  .field label .count.full { color: var(--accent); font-weight: 700; }
  .field input, .field textarea { width: 100%; margin-top: var(--g1); background: none; border: 0; outline: 0; color: var(--ink);
    font: inherit; font-size: var(--t-l); resize: none; }
  .field textarea { line-height: 1.4; overflow: hidden; display: block; padding-bottom: 0; }
  .field:has(textarea) { padding-bottom: 10.3px; }
  .field input::placeholder, .field textarea::placeholder { color: #6E6762; }
  .field input, .field textarea { caret-color: var(--accent); }
  .limit { display: flex; align-items: center; gap: var(--g3); margin-top: var(--g5); padding: var(--g3) var(--g4); border-radius: var(--r-m);
    background: var(--accent-soft); font-size: var(--t-s); }
  .badge { flex: none; display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 8px; background: var(--accent);
    color: var(--on-accent); font-weight: 700; font-size: var(--t-xs); }
  .optpreview { margin-top: var(--g3); }
  .limitnote { color: var(--muted); font-size: var(--t-xs); margin-top: var(--g2); min-height: 20px; }
  .optpreview .kicker { color: var(--muted); margin-bottom: 15.4px; }
  .optpreview .ranks { padding: 0; margin: 0; }
  .optpreview .rank { padding: var(--g3) 0; }
  .optpreview .rank { margin: 0; padding: var(--g3); border-bottom: 1px solid var(--line); }
  .optpreview .rank.you { margin: 6px 0; }
  .optpreview .rank.ghost { opacity: .55; }
  .optpreview .rank.top3 { border: 1.5px solid var(--accent); }
  .optpreview .rank.top3 .n { color: var(--accent); }
  .optpreview .rank.first::before { content: "♛"; position: absolute; right: 12px; top: 10px; color: var(--accent); font-size: 18px; }
  .optpreview .podium.solo { grid-template-columns: 1fr; padding: 18px 0 0; }
  .optpreview .podium.solo .place.you { box-shadow: none; }
  .optpreview .podium.solo { padding-top: 0; }
  .optpreview .ranks { margin: 0 !important; padding: 0 !important; }
  .optpreview .ranks .rank { margin: 0 !important; animation: none; }
  .optpreview .podium.solo { padding: 0 !important; }
  .optpreview .place { animation: none !important; }
  .limitnote:empty { display: none; }
  .optpreview .podium.solo .place { padding: var(--g3) var(--g4); border-color: color-mix(in srgb, var(--accent) 50%, transparent) !important; }
  .optpreview .podium.solo .medal { width: 28px; height: 28px; font-size: var(--t-xs); margin-bottom: 6px; box-shadow: none; }
  .optpreview .podium.solo .name { font-size: var(--t-m); }
  .optpreview .podium.solo .msg { font-size: var(--t-xs); line-height: 1.35; margin-top: 4px; }
  .optpreview .podium.solo .crown { width: 36px; height: 24px; top: -13px; }

<script>
"use strict";
// F's words (docs/support-text.md, 47a38854). PRE lines are coffee only; the juice is in SUPPORTER lines alone.
const T = {
  cardTitle: "Buy me a coffee", cardLine: "You made it to the bottom. Fancy a coffee?",
  popupLine: "Your thumbs have been busy.", tiles: ["Words", "Swipes", "Fixes", "Gestures"], popupButton: "See the good people", nah: "Nah",
  heading: "Support TitanKeys",
  // Owner: one sentence, no bullets.
  intro: "Donating gets you nothing, but it lets me spend more time on fixes, languages and new tricks.",
  fund: "Supporters", fundLine: "The good people, by rank.",
  supporters: "The good people", supportersLine: "Cheers, all of you.",
  empty: "Nobody here yet. Any amount puts you at #1.", anonymous: "Anonymous", report: "Report", reported: "Got it. We'll take a look.",
  oneTime: "One-time", monthly: "Monthly",
  tiers: [["A sip", "Small, but it counts."], ["A big sip", "Now we're brewing."], ["Half a coffee", "That's real caffeine."]],
  custom: ["Custom", "You pick."],
  monthlyNote: "Every month · cancel any time in Play",
  // The monthly coffee you have, and switching it (owner, 2026-11-24: easy to see, never two at once).
  yourMonthly: (name, renewing) => renewing ? `You give ${name} each month.` : `Cancelled. ${name[0].toUpperCase() + name.slice(1)} a month, until this month ends.`,
  manage: "Manage", yours: "Your monthly coffee", switchTo: "Switch to this", keepGoing: "Keep it going",
  switchNote: "Replaces the one you have. Play counts what's left of this month.", howMuch: "How much coffee?",
  wholePot: "That's a whole pot. I'll need a bigger table.",
  putsYou: (n, m) => m && m !== n ? `<b>#${n}</b><span class="from"> ▲ from #${m}</span>` : `You'd be <b>#${n}</b>`,
  chipIn: "Buy it",
  thanksTitle: "Thank you!", thanksLine: "Fun fact: I don't actually drink coffee. I'm more of an orange juice person. But this means a lot.",
  join: "Join the board?", nameField: "Name", namePlaceholder: "Your name", messageField: "Message (optional)",
  limits: { 3: "120 characters. Say something grand.", 10: "80 characters. Make it count.", 100: "40 characters. Short and sweet.", 0: "Name only for now. Climb for a message." },
  addMe: "Add me",
  invite: tier => `You're in the top ${tier} now. Want a longer message?`, writeMore: "Write more", later: "Not now",
  privacy: "Only names, messages and rank. Leave any time.", removeMe: "Remove me", editMe: "Edit my name and message", joinLink: "Join the board", yourEntry: "Your name on it", save: "Save",
  billing: "Play can't take payments on this phone.", notReady: "Play's still waking up. Try again soon.",
  offline: "You're offline. The board will be back.",
  allRanks: () => "See everyone", retry: "Try again", previewLabel: "Here's you on the board",
  perMonth: "/month",
  beFirst: "Be the first", topBadge: "Top 3",
  popupAfter: "TitanKeys is free. Buy me a coffee?",
  youGave: cups => `You bought me ${cupsText(cups)}`,
  inTotal: (cups, rank) => `${cups} in total${rank ? ` · you're #${rank}` : ""}`,
  unlockHead: (spots, top) => `${spots} ${spots === 1 ? "spot" : "spots"} from the top ${top}`,
  unlockSub: (top, chars) => `Top ${top} gets ${chars} characters`,
  boardBar: rank => `A sip · you'd be #${rank}`,
  pickCup: "Pick a cup",
  // Placeholders for F (round 7): the move-up progress line, the Top 10 divider, the report sheet's line.
  progress: (rank, top, spots) => `#${rank} → top ${top} · ${spots} to go`,
  top10: "Top 10",
  reportWhat: name => `Report ${name}?`, cancel: "Never mind",
  // Placeholder for F (round 9): the report sheet's body line.
  reportBody: "We'll check it, and it goes if it breaks the rules.",
  joinAction: "Put me on the board",
  // Stand-in (F: wording): the opt-in's note over the limit.
  limitNote: "The higher you rank, the more you can say.",
  amount: (cups, rank) => `${cupsText(cups)}${rank ? ` · you're #${rank}` : ""}`,
};
const LIMITS = [[3, 120], [10, 80], [100, 40]];
const limitAt = rank => rank ? (LIMITS.find(([top]) => rank <= top) || [0, 0])[1] : 0;
const tierAt = rank => rank ? (LIMITS.find(([top]) => rank <= top) || [0])[0] : 0;
/**
 * How much, in words that only grow, never a number: a sip, a big sip, half a coffee, a coffee, a few coffees, a whole pot
 * (owner, 2026-11-21: "better to be vague, like a sip, a big sip, half a coffee"; "I dont really like a quarter sth"). A cup
 * is $5. The cups drawn beside it show the exact amount.
 */
function cupsText(cups) {
  const dollars = cups * 5 + 1e-6;
  return dollars < 1 ? "a sip" : dollars < 2.5 ? "a big sip" : dollars < 5 ? "half a coffee"
    : dollars < 10 ? "a coffee" : dollars < 25 ? "a few coffees" : "a whole pot";
}

// Sample data, used when there's no bridge (preview and renders): long names and messages at each limit.
const L120 = "Finally a keyboard that gets the Titan. Swiping on real keys still feels like a magic trick, every day. Thank you!";
const L80 = "Obrigado from Lisbon. Accents on hold are perfect for Portuguese. Keep going!";
const L40 = "Polish without Gboard, finally. Dzięki!";
const SAMPLE_ROWS = [
  ["Maximilian Alexander von Hohenzollern-Sigmaringen", L120, 6200], [null, L120, 4500], ["Priya Ramanathan-Krishnamurthy", L120, 3300],
  ["Tomás", L80, 2100], ["Sam K.", null, 1100], [null, "Keep going.", 800], ["Lukas", L80, 600], ["Ana", "the guide is so good", 500],
  ["R.", null, 400], ["Kenji Watanabe-Yamamoto", L80, 300], ["Olu", L40, 300], [null, null, 200], ["Marta", L40, 220], ["Dev", null, 100],
  ["Chris", L40, 100], ["Felix", "Hi from Berlin", 50],
];
const SAMPLE = {
  state: { products: [
    { id: "support_monthly_sip", price: "$0.50", baseCents: 50 }, { id: "support_monthly_small", price: "$1.00", baseCents: 100 },
    { id: "support_monthly_full", price: "$2.50", baseCents: 250 }, { id: "support_tip_sip", price: "$0.50", baseCents: 50 },
    { id: "support_tip_small", price: "$1.00", baseCents: 100 }, { id: "support_tip_full", price: "$2.50", baseCents: 250 },
    { id: "support_tip_unit", price: "$1.00", baseCents: 100 } ], totalCents: 0, billing: "ready", reduceMotion: false, preview: true },
  mine: 150, joined: false, stats: [12408, 3112, 214, 388], offline: false, empty: false,
};
function sampleBoard(addCents = 0) {
  if (SAMPLE.offline) return { available: false, entries: [] };
  if (SAMPLE.empty) return { available: true, entries: [], total: 0, myRank: null, joined: false };
  const rows = SAMPLE_ROWS.map(([name, message, cents], i) => ({ id: "s" + i, name, message, cents }));
  if (SAMPLE.joined) rows.push({ id: "you", name: "Mei Wong", message: L80, cents: SAMPLE.mine + addCents, you: true });
  rows.sort((a, b) => b.cents - a.cents);
  const entries = rows.map((r, i) => ({ ...r, rank: i + 1,
    message: r.message && limitAt(i + 1) ? cut(r.message, limitAt(i + 1)) : null }));
  return { available: true, postingReady: true, joined: SAMPLE.joined, entries, total: entries.length,
    myRank: SAMPLE.joined ? entries.find(e => e.you).rank : null };
}
// Where the sample supporter lands; an empty board makes anyone #1.
const sampleRank = addCents => SAMPLE.empty ? 1 : SAMPLE_ROWS.filter(r => r[2] > SAMPLE.mine + addCents).length + 1;

// G's bridge (claude/support-webview): TitanKeysSupport.post(JSON {id, op, args}); answers and events come back through
// window.titankeysSupport.receive(text). Without it, the samples answer, so the page previews on its own.
const native = window.TitanKeysSupport;
let nextId = 1;
const waiting = new Map();
const events = { receipt: null, state: null };
window.titankeysSupport = {
  receive(text) {
    const msg = JSON.parse(text);
    if (msg.event) { events[msg.event]?.(msg.data); return; }
    const wait = waiting.get(msg.id); if (!wait) return;
    waiting.delete(msg.id);
    msg.ok ? wait.resolve(msg.result) : wait.reject(new Error(msg.error));
  },
  // The phone's Back key: true when the page handled it, false when the screen should close.
  back() {
    if (document.querySelector(".sheetwrap")) {
      document.querySelector(".sheetwrap").remove();
      document.querySelectorAll(".rank.held").forEach(x => x.classList.remove("held"));
      return true;
    }
    const id = document.querySelector(".view.on")?.id;
    if (id === "popup") { api.nah(); return true; }
    if (!id || id === "support" || id === "settings") return false;
    const button = document.querySelector(".view.on .bar .back");
    if (button) button.click(); else route("support");
    return true;
  },
};
const call = (op, args = {}) => new Promise((resolve, reject) => {
  const id = nextId++;
  waiting.set(id, { resolve, reject });
  native.post(JSON.stringify({ id, op, args }));
});
/**
 * One of TitanKeys' haptics, timed by the page (SupportWebProtocol.HAPTICS): press, tick, pick, join or celebrate. It doesn't
 * wait for an answer, so it lands on the frame that asked for it. The app's own switches and pacing still apply.
 */
const buzz = name => { if (native) native.post(JSON.stringify({ id: nextId++, op: "haptic", args: { name } })); };
const STAT_KEYS = ["words", "swipes", "corrections", "gestures"];
const api = {
  state: () => native ? call("state") : Promise.resolve(SAMPLE.state),
  // Every page of the board, up to 100 places (each page is a read the server counts).
  board: async () => {
    if (!native) return sampleBoard();
    let data = await call("board", { page: 0 });
    for (let page = 1; page < 5 && data.available && data.nextOffset; page++) {
      const more = await call("board", { page });
      if (!more.available) break;
      data = { ...more, entries: [...data.entries, ...more.entries] };
    }
    return data;
  },
  preview: cents => native ? call("previewRank", { cents }).then(r => ({ ...r, myRank: r.myRank ?? board.myRank })) : Promise.resolve(SAMPLE.offline
    ? { available: false } : { available: true, rank: sampleRank(cents), myRank: SAMPLE.joined ? sampleRank(0) : null }),
  buy: (productId, quantity) => native ? call("purchase", quantity > 1 ? { productId, quantity } : { productId }) : Promise.resolve({ result: "preview" }),
  join: (anonymous, name, message) => native ? call("joinBoard", anonymous ? { anonymous } : { anonymous, name, message }) : Promise.resolve({ available: true }),
  report: publicId => native ? call("report", { publicId }) : Promise.resolve({ available: true, ok: true }),
  remove: () => native ? call("removeMe") : Promise.resolve({ available: true }),
  nah: () => native ? call("dismissPopup").then(() => call("close")) : Promise.resolve(history.back()),
  close: () => native ? call("close") : Promise.resolve(history.back()),
  manage: () => native ? call("manageMonthly") : Promise.resolve({}),
  stats: async () => native ? STAT_KEYS.map(k => (state.stats || {})[k] || 0) : SAMPLE.stats,
};

// ---------- Rendering. ----------
// Animation frames on a 16 ms timer: the same on screen, and they still run where frame callbacks are paused.
const frame = fn => setTimeout(() => fn(performance.now()), 16);
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ease = t => 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);
let reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let state = SAMPLE.state, board = { available: false, entries: [] };
let cadence = "m", tier = 0, dollars = 5, lastRank = null;
// The place the last payment reached: the opt-in and its message limit follow it, not a fresh estimate.
let paidRank = null;
// Where Not now on the join form goes: the coffees after a payment, the board when joining later or editing from it.
let optinBack = "support", editing = false;

let cupId = 0;

    $("#thankscup").classList.toggle("mark", el >= D && el < D + HOLD + 200);
    $("#thankscup").classList.toggle("pinned", !!pin);
    const finish = ease((el - D - HOLD) / FILL);
    flood.style.height = (e * level + over + finish * (full - level)) + "px";
    if (!pin && !reduce) {
      const now = performance.now(), step = Math.floor(e * STEPS), fstep = Math.floor(Math.max(0, finish) * 8);
      if (x < 1 && step > feel.rise) { feel.rise = step; feel.last = now; buzz("tick"); }
      if (x >= .8 && !feel.crest) { feel.crest = true; feel.last = now; buzz("tick"); }
      if (el >= D && !feel.mark) { feel.mark = true; feel.last = now; buzz("celebrate"); }
      if (fstep > feel.finish) { feel.finish = fstep; feel.last = now; buzz("tick"); }
    }
    if (giftCups > 3 && el >= D && !burst) { burst = true; confetti(!!pin); }
    const t = el / D;
    // The cups fill one after another to the gift, in step with the rise.
    const poured = (drawn > 5 ? 1 : giftCups) * Math.min(1, e);
    fills.forEach((fl, i) => { fl.style.transition = "none"; fl.style.transform = `scaleY(${Math.max(0, Math.min(1, poured - i))})`; });
    $("#amount").textContent = T.youGave(giftCups * Math.min(1, e));
    $("#total").textContent = Math.abs(totalCups - giftCups) < .01 ? (t >= 1 && rank ? `you're #${rank}` : "") : T.inTotal(cupsText(totalCups), t >= 1 ? rank : null);
    // The words turn dark as the orange takes the screen, and settle once it has.
    view.classList.toggle("dark-words", finish > .5 || level >= H * .95);
    // The glow only over the orange: none while the cups are still above the liquid.
    const cupRect = $("#thankscup").getBoundingClientRect(), floodTop = flood.getBoundingClientRect().top;
    $("#thankscup").classList.toggle("onblack", cupRect.bottom < floodTop);
    // Ring and glow sized from the cups (untransformed): the ring clears them by 10.3 CSS (16 phone px); the glow ends 25.6 CSS
    // (40 phone px) outside it, clipped to the liquid.
    const host = $("#thankscup"), cupsOnly = [...host.querySelectorAll(":scope > svg, :scope > .times")];
    if (cupsOnly.length) {
      const hr = host.getBoundingClientRect(), k = hr.width / (host.offsetWidth || hr.width || 1), rs = cupsOnly.map(c => c.getBoundingClientRect());
      const L = Math.min(...rs.map(q => q.left)) / k, Rr = Math.max(...rs.map(q => q.right)) / k;
      const T = Math.min(...rs.map(q => q.top)) / k, B = Math.max(...rs.map(q => q.bottom)) / k;
      const ring = Math.hypot(Rr - L, B - T) + 20.6, glow = ring + 51.2;
      host.style.setProperty("--ring", ring + "px"); host.style.setProperty("--glow", glow + "px");
      // In CSS px: the rects are zoomed (ZOOM), offsetHeight isn't.
      const glowTop = host.getBoundingClientRect().top / ZOOM + host.offsetHeight / 2 - glow / 2;
      host.style.setProperty("--glowclip", Math.max(0, floodTop / ZOOM - glowTop) + "px");
    }
    if (el < D + HOLD + FILL && !pin) raf = frame(f);
    if (finish >= .6) { $("#amount").textContent = T.youGave(giftCups); view.classList.add("settled"); }
  };
  raf = frame(f);
}

/** Past three cups: a small burst of cups from the big one. */
function confetti(pinned = false) {
  if (reduce && !pinned) return;
  const host = $("#thankscup");
  host.insertAdjacentHTML("beforeend", Array.from({ length: 8 }, (_, i) => {
    const a = (i / 8) * Math.PI * 2 - Math.PI / 2, d = 150 + (i % 3) * 26;
    return `<span class="confetti${pinned ? " pinned" : ""}" style="--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d}px;--r:${(i % 2 ? 1 : -1) * (20 + i * 9)}deg">${cup(.6, 18)}</span>`;
  }).join(""));
}
function drawOptin(rank) {
  const n = limitAt(rank), t = tierAt(rank);
  $("#optin [data-act=add]").textContent = editing ? T.save : T.addMe;
  // A rank the server couldn't give (offline, or no answer) isn't "Beyond 100": the badge and the preview wait for a real one.
  $("#limit").innerHTML = rank ? `<span class="badge">${t ? "Top " + t : "Beyond 100"}</span><span>${esc(T.limits[t])}</span>` : "";
  $("#limit").style.display = rank ? "" : "none";
  $("#msgfield").style.display = n ? "" : "none";
  const name = $("#bn"), msg = $("#bm");
  msg.maxLength = n || 0;
  msg.rows = 1;
  const grow = () => { msg.style.height = "auto"; msg.style.height = msg.scrollHeight + "px"; };
  const count = () => {
    $("#namecount").textContent = `${name.value.length}/40`;
    $("#msgcount").textContent = `${msg.value.length}/${n}`; $("#msgcount").classList.toggle("full", msg.value.length >= n);
    $("#overlimit").textContent = n && msg.value.length >= n ? T.limitNote : "";
    // The board only lists names (owner, 2026-11-20: "if they are anonymous they don't get on the board"): Add me waits
    // for one, and the preview shows where it will go.
    $("#optin [data-act=add]").disabled = !name.value.trim();
    const me = { id: "p", rank, name: name.value.trim() || T.namePlaceholder, message: n ? msg.value.slice(0, n) || null : null, you: true };
    // Beyond the top 100, the places around yours, so the row has a board to sit on.
    const rows = n ? [me] : [{ id: "a", rank: rank - 1, name: "Jun", message: null, ghost: true }, me, { id: "b", rank: rank + 1, name: "Sam", message: null, ghost: true }];
    if (!rank) { $("#optpreview").innerHTML = ""; return; }
    $("#optpreview").innerHTML = `<div class="kicker">${T.previewLabel}</div>` + (rank <= 3
      ? podium([me]).replace('<div class="podium">', '<div class="podium solo">').replace(rank === 1 ? /$^/ : /<svg class="crown"[\s\S]*?<\/svg>/, "")
      : ranks(rows, 0, rows.length, false));
  };
  name.oninput = count; msg.oninput = () => { grow(); count(); }; count(); setTimeout(grow, 0);
}

function toast(text) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = text;
  $("#app").appendChild(el); setTimeout(() => el.remove(), 2200);
}

// ---------- Split screens: header and pay bar fixed, the content between them scrolls. ----------
for (const id of ["support", "custom", "board"]) {
  const v = $("#" + id), sc = document.createElement("div");
  sc.className = "scroll";
  [...v.children].filter(c => !c.matches(".bar, .dock, #boardbar")).forEach(c => sc.appendChild(c));
  v.insertBefore(sc, v.querySelector(":scope > .dock, :scope > #boardbar"));
  v.classList.add("split");
}
/** The element that scrolls in screen [v]: its .scroll when split, else the screen itself. */
const scroller = v => v.querySelector(":scope > .scroll") || v;
// ---------- Navigation. ----------
function show(id) {
  document.documentElement.classList.toggle("see-through", !!native && id === "popup");
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id));
  const v = $("#" + id); if (v) scroller(v).scrollTop = 0;
}
document.addEventListener("click", async ev => {
  // Every touch press plays something, as in the app: a coffee or an amount picked, or joining, is done; the rest is a click.
  // The phone's Back key clicks the page's own back button, and a key press already clicks under the thumb, so it plays nothing
  // (handbook, docs/haptics.md: physical keys never buzz; owner, 2026-11-24: "no need haptics for physical back").
  const pressed = ev.isTrusted && ev.target.closest("button, [data-go], [data-tier], [data-cad]");
  if (pressed) buzz(pressed.closest("[data-tier], #quick") || (pressed.dataset.act === "add" && $("#bn").value.trim()) ? "pick" : "press");
  const go = ev.target.closest("[data-go]"); if (go) { route(go.dataset.go); return; }
  const ex = ev.target.closest("[data-expand]"); if (ex) { ex.classList.toggle("open"); return; }
  const cad = ev.target.closest("[data-cad]"); if (cad) { cadence = cad.dataset.cad; if (tier === 3) tier = 0; drawTiers(); return; }
  const t = ev.target.closest("[data-tier]"); if (t) { tier = +t.dataset.tier; tiersSeen = true; drawTiers(); return; }
  const conf = ev.target.closest("[data-confirm]");
  if (conf) { document.querySelector(".sheetwrap")?.remove(); document.querySelectorAll(".rank.held").forEach(x => x.classList.remove("held"));
    await api.report(conf.dataset.confirm).catch(() => {}); toast(T.reported); return; }
  if (ev.target.classList.contains("sheetwrap") || ev.target.closest("[data-act=closesheet]")) { document.querySelector(".sheetwrap")?.remove();
    document.querySelectorAll(".rank.held").forEach(x => x.classList.remove("held")); return; }
  document.querySelectorAll(".popover").forEach(p => p.remove());
  document.querySelectorAll(".rank.held").forEach(x => x.classList.remove("held"));
  const act = ev.target.closest("[data-act]")?.dataset.act;
  if (act === "nah") api.nah();
  if (act === "add" && !$("#bn").value.trim()) return;
  if (act === "add") { await api.join(false, $("#bn").value.trim(), $("#bm").value.trim()).catch(() => {}); SAMPLE.joined = true; route("fund"); }
  if (act === "remove") { await api.remove().catch(() => {}); SAMPLE.joined = false; route("board"); }
  if (act === "later") route(optinBack);
  if (act === "manage") api.manage();
  if (act === "joinlater" || act === "edit") {
    const me = act === "edit" && (board.entries || []).find(x => x.you);
    const r = me ? { available: true, rank: me.rank } : await api.preview(0).catch(() => ({ available: false }));
    $("#bn").value = me?.name || ""; $("#bm").value = me?.message || "";
    paidRank = r.available ? r.rank : null; optinBack = "board"; editing = !!me; route("optin");
  }
  if (act === "first") { cadence = "o"; tier = 0; drawTiers(); const v = scroller($("#support")); v.scrollTo({ top: v.scrollHeight, behavior: reduce ? "auto" : "smooth" }); }
  if (act === "write") route("optin");
  if (act === "retry") route(document.querySelector(".view.on").id === "board" ? "board" : "support");
});
// Hold a row for half a second to report it.
function openReport(li) {
  document.querySelectorAll(".popover").forEach(p => p.remove());
  document.querySelectorAll(".rank.held").forEach(x => x.classList.remove("held"));
  li.classList.add("held");
  const name = li.querySelector(".nm")?.textContent || T.anonymous;
  document.querySelector(".sheetwrap")?.remove();
  $("#app").insertAdjacentHTML("beforeend", `<div class="sheetwrap" data-act="closesheet"><div class="reportsheet"><div class="grab"></div>
    <p>${esc(T.reportWhat(name))}</p><div class="sheetbody">${esc(T.reportBody)}</div><button class="outline" data-confirm="${li.dataset.hold}">${T.report}</button><button class="quiet" data-act="closesheet">${T.cancel}</button></div></div>`);
}
let holdTimer;
document.addEventListener("pointerdown", ev => {
  const li = ev.target.closest("[data-hold]"); if (!li) return;
  li.classList.add("pressed");
  holdTimer = setTimeout(() => { li.classList.remove("pressed"); openReport(li); }, 500);
});
for (const e of ["pointerup", "pointercancel", "pointerleave"]) document.addEventListener(e, () => {
  clearTimeout(holdTimer); document.querySelectorAll(".rank.pressed").forEach(x => x.classList.remove("pressed"));
}, true);
document.addEventListener("contextmenu", ev => { const li = ev.target.closest("[data-hold]"); if (li) { ev.preventDefault(); openReport(li); } });
// Paying: Play takes over. The thank-you comes with the receipt event (in the samples, at once).
$("#pay").onclick = $("#pay2").onclick = async ev => {
  if (ev.currentTarget.id === "pay" && !tiersSeen) {
    const v = scroller($("#support"));
    v.scrollTo({ top: $("#cadence").offsetTop - 80, behavior: reduce ? "auto" : "smooth" });
    return;
  }
  const s = selected(); if (!s) return;
  if (cadence === "m" && tier !== 3 && state.monthly?.id === s.id) { if (!state.monthly.renewing) api.manage(); return; }
  const r = await api.buy(s.id, tier === 3 ? dollars : 1).catch(() => ({ result: "unavailable" }));
  if (r.result === "unavailable") $("#paynote").textContent = T.billing;
  if (!native) paid(s.cents);
};
$("#slider").oninput = e => { const was = dollars; dollars = toDollars(+e.target.value); if (dollars !== was) buzz("tick"); drawCustom(); };
// The typed amount is local money: "7.50", "7,50" or "1,500" all read. It becomes the nearest whole number of units, 1 to 50.
const typedAmount = text => {
  const t = text.replace(/[^\d.,]/g, ""), m = t.match(/^(.*)[.,](\d{1,2})$/);
  return m ? +(m[1].replace(/[.,]/g, "") + "." + m[2]) : +t.replace(/[.,]/g, "");
};
$("#custd").oninput = e => {
  const unit = customUnit(), each = unit?.amountMicros ? unit.amountMicros / 1e6 : 1;
  const v = Math.round(typedAmount(e.target.value) / each);
  if (v >= 1 && v <= 50) { dollars = v; drawCustom(); }
  // Custom buys whole coffees, so after a short pause the box shows what the button charges (overnight test, 2026-11-24: the
  // box said 15 while the button said CA$15.29).
  clearTimeout(snapWait);
  snapWait = setTimeout(() => { const p = unit?.amountMicros != null && moneyParts(unit.amountMicros * dollars, unit.currency);
    if (p) $("#custd").value = p.num; }, 900);
};
let snapWait;
document.querySelectorAll("#quick button").forEach(b => b.onclick = () => { dollars = +b.dataset.dollars; drawCustom(); });
$("#custd").onblur = () => { drawCustom(); };
for (const id of ["support", "board", "settings", "optin", "custom"]) scroller($("#" + id)).addEventListener("scroll", e => {
  e.target.closest(".view").querySelector(".bar")?.classList.toggle("scrolled", e.target.scrollTop > 8);
  docks();
});
/** The tiers count as seen once they're fully above the dock. */
function seeTiers() { if (!tiersSeen) { tiersSeen = true; drawPay($("#pay")); } }

/** The docks' fade shows only while something scrolls beneath them. */
function docks() {
  document.querySelectorAll(".view.on .dock, .view.on .boardbar").forEach(d => {
    const v = scroller(d.closest(".view"));
    d.classList.toggle("covering", v.scrollHeight - v.scrollTop - v.clientHeight > 2);
  });
}
new MutationObserver(() => setTimeout(docks, 0)).observe(document.getElementById("app"), { subtree: true, childList: true, attributes: true, attributeFilter: ["class"] });

/** After a payment: the thank-you, then the opt-in, or the move-up invite for someone already on the board. */
function afterPayment(totalCups, rank, before, joined, forceMoveUp, giftCups = totalCups, pin = null) {
  const movedUp = forceMoveUp ?? (joined && rank && tierAt(rank) && tierAt(rank) < (tierAt(before) || 999));
  const next = LIMITS.filter(([top]) => rank && top < rank).pop();
  const spots = next ? rank - next[0] : 0, segs = Math.min(spots, 12);
  const card = next ? `<div class="progress"><div class="pl"><b>${esc(T.progress(rank, next[0], spots))}</b><span>${esc(T.unlockSub(next[0], next[1]))}</span></div>
      <div class="segbar">${Array.from({ length: segs }, (_, i) => `<i></i>`).join("")}</div></div>`
    : `<div class="progress"><div class="pl"><b>${esc(T.invite(tierAt(rank)))}</b></div></div>`;
  const actions = movedUp ? `${card}<button class="primary" data-act="write">${T.writeMore}</button><button class="quiet" data-act="later">${T.later}</button>`
    : joined ? `<button class="primary" data-go="fund">${T.popupButton}</button>`
    : `<button class="primary" data-go="optin">${T.joinAction}</button><button class="quiet" data-act="later">${T.later}</button>`;
  paidRank = rank || null; optinBack = "support"; editing = false;
  show("thanks"); thanks(totalCups, rank, actions, giftCups, pin);
  drawOptin(rank || 101);
}
function paid(cents, opts = {}) {
  const total = opts.cups ?? (SAMPLE.mine + cents) / 500;
  const before = SAMPLE.joined ? sampleRank(0) : null, after = sampleRank(Math.round(total * 500) - SAMPLE.mine);
  afterPayment(total, after, before, SAMPLE.joined, opts.moveUp, opts.gift ?? (opts.cups ? Math.min(total, opts.cups) : cents / 500), opts.pin);
}
events.receipt = async receipt => {
  rankMemo.clear();
  const r = await api.preview(0).catch(() => ({ available: false }));
  afterPayment((receipt.totalCents ?? state.totalCents) / 500, r.available ? r.rank : null, board.myRank ?? null, !!board.joined, undefined,
    ((receipt.totalCents ?? 0) - (receipt.previousCents ?? 0)) / 500 || undefined);
};
events.state = data => { state = data; reduce = reduce || !!data.reduceMotion; drawTiers(); };

// A screen never waits for the app for good: an answer that doesn't come in time counts as the board offline, or the state
// as it was, and a late answer still updates it through its event. A screen that waited for an answer that never came stayed
// black (owner, 2026-11-20: "Sometimes it opens blank").
const ANSWER_MILLIS = 6000;
const within = (promise, fallback) => Promise.race([promise.catch(() => fallback),
  new Promise(resolve => setTimeout(() => resolve(fallback), ANSWER_MILLIS))]);
const OFFLINE_BOARD = { available: false, entries: [] };
// In the app, a state that didn't come is never the samples: no prices, and the button waits for Play.
const waitingState = () => native && state === SAMPLE.state ? { products: [], totalCents: 0, billing: "waiting", reduceMotion: false } : state;

async function route(id) {
  // In the app, Settings is behind this screen: going back closes it.
  if (id === "settings" && native) { api.close(); return; }
  // Back from Custom, the list's button belongs to a coffee on the list again, not Custom's amount (overnight test, 2026-11-24).
  if (id === "support" && tier === 3) { tier = 0; cadence = "o"; }
  if (id === "support") { rankMemo.clear(); board = await within(api.board(), OFFLINE_BOARD); state = await within(api.state(), waitingState()); drawBoardPreview(); drawTiers(); }
  if (id === "board" || id === "fund") { board = await within(api.board(), OFFLINE_BOARD); drawBoardFull(id === "fund" || !!state.supporter); show("board"); return; }
  if (id === "custom") drawCustom();
  if (id === "popup") { if (native) state = await within(api.state(), waitingState()); drawPopup(await api.stats()); }
  if (id === "optin") drawOptin(paidRank || (native ? null : sampleRank(selected()?.cents || 0)));
  show(id);
}

// ---------- Start, and the render states (?state=...). ----------
fillText();
const q = new URLSearchParams(location.search);
if (q.get("reduce")) { reduce = true; document.documentElement.classList.add("reduce"); }
if (q.get("empty")) SAMPLE.empty = true;
if (q.get("offline")) SAMPLE.offline = true;
if (q.get("joined")) SAMPLE.joined = true;
if (q.get("cad")) cadence = q.get("cad");
if (q.get("tier")) { tier = +q.get("tier"); tiersSeen = true; }
if (q.get("picked")) tiersSeen = true;
if (q.get("dollars")) dollars = +q.get("dollars");
(async () => {
  // Native opens #page or #popup.
  const s = { page: "support" }[location.hash.slice(1)] || q.get("state") || location.hash.slice(1) || "support";
  if (s === "thanks") { await route("support"); paid(selected().cents, { cups: q.get("cups") ? +q.get("cups") : undefined, gift: q.get("gift") ? +q.get("gift") : undefined, moveUp: q.get("moveup") ? true : undefined, pin: q.get("pin") }); }
  else if (s === "optin") {
    show("optin"); const rank = +(q.get("rank") || 8); drawOptin(rank);
    if (q.get("fill")) { $("#bn").value = "Maximilian Alexander von Hohenzollern"; $("#bm").value = L120.slice(0, limitAt(rank)).replace(/\s+\S*$/, L120.length <= limitAt(rank) ? "$&" : ""); $("#bn").dispatchEvent(new Event("input")); }
  }
  else if (s === "checkout") {
    tiersSeen = true;
    await route("support");
    const sel = selected();
    $("#overlay").innerHTML = `<div class="scrim"><div class="checkout"><div class="grab"></div><div class="kicker">Test checkout · Debug</div>
      <div class="row"><span>${esc(T.tiers[tier][0])} · ${cadence === "m" ? T.monthly : T.oneTime}</span><b>${sel.price}${cadence === "m" ? T.perMonth : ""}</b></div>
      <p>Sample payment. No charge.</p><button class="primary">Confirm</button></div></div>`;
  }
  else await route(s);
  if (q.get("scroll")) { const v = scroller(document.querySelector(".view.on")); v.scrollTop = { mid: (v.scrollHeight - v.clientHeight) / 2, bottom: v.scrollHeight }[q.get("scroll")] ?? +q.get("scroll"); v.dispatchEvent(new Event("scroll")); v.closest(".view").querySelector(".bar")?.classList.toggle("scrolled", v.scrollTop > 8); docks(); }
  if (q.get("report")) { const li = [...document.querySelectorAll("#board [data-hold]")].find(x => x.getBoundingClientRect().top > 260); if (li) openReport(li); }
  if (q.get("focus")) $("#" + q.get("focus"))?.focus();
})();
</script>
