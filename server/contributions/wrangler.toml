# The TitanKeys contributions Worker, on the Workers Free plan with no payment method. Deploy steps are in README.md.
name = "titankeys-contributions"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

# The sealed batches, in 64 SQLite-backed storage objects (Shard), and one counter for the caps and the per-client
# limit (Cap). SQLite-backed Durable Objects are part of the Free plan.
[[durable_objects.bindings]]
name = "SHARDS"
class_name = "Shard"

[[durable_objects.bindings]]
name = "CAP"
class_name = "Cap"

# Bug reports and ideas from the app's form (#97), sealed the same way, in one more SQLite-backed object.
[[durable_objects.bindings]]
name = "REPORTS"
class_name = "Reports"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Cap", "Shard"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Reports"]

# Sharing's daily totals (#96), sealed the same way, in one more SQLite-backed object, kept 1 year.
[[durable_objects.bindings]]
name = "COUNTS"
class_name = "Counts"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Counts"]

# No request logs, so no internet addresses are kept, as the privacy policy says.
[observability]
enabled = false
