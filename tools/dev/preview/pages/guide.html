<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Guide Keyboard Shape</title>
<style>
  :root { --cream:#FFF1E6; --muted:#99918A; --orange:#EF804E; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#000; color:var(--cream); font-family:system-ui, sans-serif; overflow:hidden; touch-action:manipulation; }
  #top { position:absolute; inset:0 0 auto 0; padding:12px 16px; }
  h1 { font-size:20px; margin:4px 0 4px; }
  p { color:var(--muted); font-size:13px; line-height:1.3; margin:0 0 8px; }
  .card { background:#161210; border-radius:14px; padding:6px 12px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; margin-top:4px; }
  .val { color:var(--orange); font-variant-numeric:tabular-nums; }
  .ctl { display:flex; align-items:center; gap:10px; margin:2px 0 4px; }
  .ctl input { flex:1; accent-color:var(--orange); }
  button { font:inherit; color:var(--orange); background:none; border:1.5px solid var(--orange); border-radius:999px; min-width:40px; height:40px; font-size:18px; }
  button.solid { background:var(--orange); color:#000; font-size:14px; padding:0 14px; }
  #buttons { display:flex; gap:8px; margin-top:8px; }
  #info { color:var(--orange); font-size:13px; margin-top:6px; font-variant-numeric:tabular-nums; }
  canvas { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <h1>Guide keyboard shape</h1>
  <p>Your calibration, 107.5 px a key, centred. The keys are square. Set the gap between keys in a row, then the gap between rows, until it looks like the real keys.</p>
  <div class="card">
    <div class="row"><span>Gap between keys</span><span class="val" id="colVal"></span></div>
    <div class="ctl"><button data-k="col" data-d="-0.5">−</button><input id="col" type="range" min="0" max="24" step="0.5"><button data-k="col" data-d="0.5">+</button></div>
    <div class="row"><span>Gap between rows</span><span class="val" id="rowVal"></span></div>
    <div class="ctl"><button data-k="row" data-d="-0.5">−</button><input id="row" type="range" min="0" max="40" step="0.5"><button data-k="row" data-d="0.5">+</button></div>
  </div>
  <div id="buttons"><button class="solid" id="full">Full screen</button><button class="solid" id="reset">Reset</button></div>
  <div id="info"></div>
</div>
<script>
const CAL_PITCH = 107.5, CAL_WIDTH = 1076;
const ROWS = [
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L","⌫"],
  ["alt","Z","X","C","V","B","N","M","sym","↵"],
  ["⇧","○","◁","space","▦","fn","⇧"],
];
const BOTTOM = [1.2, 1.2, 1.2, 2.8, 1.2, 1.2, 1.2];
// Starting point: no gap between keys, and Unihertz's drawing's row gap (16 of 123) at this size.
const START = { col: 0, row: Math.round(16 / 108 * CAL_PITCH * 2) / 2 };
let state = { ...START };
try { const s = JSON.parse(localStorage.getItem("guide-shape") || "null"); if (s) state = s; } catch (e) {}

const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
let W = 0, H = 0;

function draw() {
  const dpr = devicePixelRatio;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  // The calibration is in the screen's pixels at 1076 wide; the canvas is in device pixels.
  const s = W / CAL_WIDTH;
  const pitch = CAL_PITCH * s, gap = state.col * s, key = pitch - gap, keyH = key, row = keyH + state.row * s;
  const span = 10 * pitch - gap, left = (W - span) / 2;
  const height = 3 * row + keyH, top = H - height;
  ctx.lineWidth = Math.max(1, Math.round(dpr * 0.75));
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ROWS.forEach((names, r) => {
    const y = top + r * row;
    let boxes;
    if (r < 3) boxes = names.map((n, c) => [n, left + c * pitch, key]);
    else {
      const room = span - (names.length - 1) * gap; let at = left;
      boxes = names.map((n, i) => { const w = room * BOTTOM[i] / 10; const b = [n, at, w]; at += w + gap; return b; });
    }
    for (const [name, x, w] of boxes) {
      const radius = Math.min(w, keyH) * 0.12;
      ctx.beginPath(); ctx.roundRect(x + 0.5, y + 0.5, w - 1, keyH - 1, radius);
      ctx.fillStyle = "rgba(239,128,78,0.06)"; ctx.fill();
      ctx.strokeStyle = "rgba(239,128,78,0.55)"; ctx.stroke();
      const letter = name.length === 1;
      ctx.fillStyle = "rgba(255,241,230,0.85)";
      ctx.font = `800 ${Math.round(Math.min(w, keyH) * (letter ? 0.5 : 0.34))}px system-ui, sans-serif`;
      ctx.fillText(name, x + w / 2, y + keyH / 2);
    }
  });
  document.getElementById("colVal").textContent = `${state.col} px`;
  document.getElementById("rowVal").textContent = `${state.row} px`;
  document.getElementById("col").value = state.col;
  document.getElementById("row").value = state.row;
  document.getElementById("info").textContent =
    `Keys ${(CAL_PITCH - state.col).toFixed(1)} px square, all four rows ${Math.round(height / s)} px tall`;
}

function save() {
  try { localStorage.setItem("guide-shape", JSON.stringify(state)); } catch (e) {}
  fetch("/save", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ page: "guide-shape", pitch: CAL_PITCH, width: CAL_WIDTH, colGap: state.col, rowGap: state.row }) }).catch(() => {});
}

function set(k, v) { state[k] = Math.max(0, Math.min(k === "col" ? 24 : 40, Math.round(v * 2) / 2)); draw(); save(); }

function resize(entries) {
  const e = entries && entries[0];
  if (e && e.devicePixelContentBoxSize) { W = e.devicePixelContentBoxSize[0].inlineSize; H = e.devicePixelContentBoxSize[0].blockSize; }
  else { W = Math.round(canvas.clientWidth * devicePixelRatio); H = Math.round(canvas.clientHeight * devicePixelRatio); }
  canvas.width = W; canvas.height = H; draw();
}
try { new ResizeObserver(resize).observe(canvas, { box: "device-pixel-content-box" }); } catch (e) { new ResizeObserver(resize).observe(canvas); }

document.getElementById("col").addEventListener("input", e => set("col", +e.target.value));
document.getElementById("row").addEventListener("input", e => set("row", +e.target.value));
for (const b of document.querySelectorAll("button[data-k]")) b.addEventListener("click", () => set(b.dataset.k, state[b.dataset.k] + +b.dataset.d));
document.getElementById("reset").onclick = () => { state = { ...START }; draw(); save(); };
document.getElementById("full").onclick = () => document.documentElement.requestFullscreen?.({ navigationUI: "hide" }).catch(() => {});
document.addEventListener("fullscreenchange", () => { document.getElementById("full").style.display = document.fullscreenElement ? "none" : ""; });
</script>
</body>
</html>
